<!DOCTYPE html>
<html lang="es">

<head>

    <link
        rel="icon"
        type="image/png"
        href="img/logo.png"
    >

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="SATORII — Descubre todos nuestros productos: poleras, Anime Goods, Torii y más."
    >

    <title>Productos | SATORII</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <style>

        /* =====================================================
           ANIME — ESTRUCTURA
        ====================================================== */

        .products-page {

            width: min(
                var(--satori-content-width, 1800px),
                calc(
                    100% -
                    (
                        var(--satori-side-space, 30px) * 2
                    )
                )
            );

            margin-left: auto;
            margin-right: auto;

            box-sizing: border-box;

        }


        /* =====================================================
           INTRO
        ====================================================== */

        .products-intro {

            padding-top: 110px;
            padding-bottom: 70px;

            text-align: center;

        }


        .products-intro-label {

            margin-bottom: 16px;

            color: var(
                --red,
                #ff1b1b
            );

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 4px;

        }


        .products-intro h1 {

            margin: 0;

            font-size: clamp(
                48px,
                6vw,
                88px
            );

            line-height: .95;

            font-weight: 900;

            letter-spacing: -4px;

            color: #111;

        }


        .products-intro h1 span {

            color: var(
                --red,
                #ff1b1b
            );

        }


        .products-intro p {

            max-width: 650px;

            margin: 25px auto 0;

            color: #666;

            font-size: 15px;

            line-height: 1.7;

        }


        /* =====================================================
           BARRA DE CATEGORÍA
        ====================================================== */

        .products-category-bar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 45px;

            padding-bottom: 18px;

            border-bottom: 1px solid #ddd;

        }


        .products-category-title {

            margin: 0;

            font-size: 14px;

            font-weight: 800;

            letter-spacing: 1px;

        }


        .products-product-count {

            color: #777;

            font-size: 12px;

        }


        /* =====================================================
           GRID
        ====================================================== */

        .products-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    5,
                    minmax(0, 1fr)
                );

            column-gap: 22px;

            row-gap: 75px;

            width: 100%;

        }


        /* =====================================================
           PRODUCTO
        ====================================================== */

        .products-product {

            display: block;

            min-width: 0;

            text-decoration: none;

            color: inherit;

        }


        /* =====================================================
           IMÁGENES
        ====================================================== */

        .products-product-image {

            position: relative;

            width: 100%;

            aspect-ratio: 1 / 1;

            overflow: hidden;

            background: #f7f7f7;

            border-radius: 8px;

        }


        .products-product-image img {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

            transition:
                opacity .35s ease,
                transform .45s ease;

        }


        .products-product-image
        .image-primary {

            opacity: 1;

        }


        .products-product-image
        .image-secondary {

            opacity: 0;

        }


        /* =====================================================
           HOVER
        ====================================================== */

        .products-product:hover
        .products-product-image
        .image-primary {

            opacity: 0;

        }


        .products-product:hover
        .products-product-image
        .image-secondary {

            opacity: 1;

        }


        .products-product:hover
        .products-product-image img {

            transform: scale(
                1.025
            );

        }


        /* =====================================================
           INFORMACIÓN
        ====================================================== */

        .products-product-info {

            padding-top: 16px;

        }


        .products-product-category {

            margin-bottom: 6px;

            color: var(
                --red,
                #ff1b1b
            );

            font-size: 9px;

            font-weight: 800;

            letter-spacing: 1.5px;

            text-transform: uppercase;

        }


        .products-product-name {

            margin: 0;

            color: #111;

            font-size: 14px;

            line-height: 1.3;

            font-weight: 600;

        }


        .products-product-price {

            margin-top: 7px;

            color: #111;

            font-size: 14px;

            font-weight: 700;

        }


        /* =====================================================
           SIN PRODUCTOS
        ====================================================== */

        .products-empty {

            grid-column: 1 / -1;

            padding: 100px 20px;

            text-align: center;

            color: #777;

        }


        .products-empty strong {

            display: block;

            margin-bottom: 10px;

            color: #111;

            font-size: 20px;

        }


        /* =====================================================
           PACK FINAL
        ====================================================== */

        .products-feature {

            position: relative;

            margin-top: 120px;

            margin-bottom: 100px;

            min-height: 230px;

            padding: 50px;

            display: flex;

            align-items: center;

            box-sizing: border-box;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #111827 0%,
                    #090d15 100%
                );

            color: #fff;

            border: 1px solid
                rgba(
                    255,
                    255,
                    255,
                    .18
                );

            border-radius: 10px;

        }


        .products-feature::before {

            content: "";

            position: absolute;

            top: 0;

            left: 0;

            width: 150px;

            height: 2px;

            background:
                var(
                    --red,
                    #ff1b1b
                );

        }


        .products-feature::after {

            content: "";

            position: absolute;

            bottom: 0;

            right: 0;

            width: 150px;

            height: 2px;

            background:
                var(
                    --red,
                    #ff1b1b
                );

        }


        .products-feature-content {

            position: relative;

            z-index: 2;

            max-width: 650px;

        }


        .products-feature-label {

            margin-bottom: 8px;

            color:
                var(
                    --red,
                    #ff1b1b
                );

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 4px;

        }


        .products-feature h2 {

            margin: 0 0 12px;

            font-size: clamp(
                30px,
                4vw,
                52px
            );

            line-height: 1;

            font-weight: 900;

        }


        .products-feature h2 span {

            color:
                var(
                    --red,
                    #ff1b1b
                );

        }


        .products-feature p {

            margin: 0;

            color: #ccc;

            font-size: 14px;

            line-height: 1.6;

        }


        /* =====================================================
           FILTROS DE PRODUCTOS
        ====================================================== */

        .products-filter-row {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 16px;

        }


        .products-filter {

            padding: 9px 15px;

            background: transparent;

            border: 1px solid #ddd;

            border-radius: 999px;

            color: #666;

            font-family: inherit;

            font-size: 9px;

            font-weight: 800;

            letter-spacing: 1px;

            cursor: pointer;

            transition:
                background .2s ease,
                border-color .2s ease,
                color .2s ease;

        }


        .products-filter:hover,
        .products-filter.active {

            background: #111;

            border-color: #111;

            color: #fff;

        }


        /* =====================================================
           TABLET
        ====================================================== */

        @media (max-width: 1400px) {

            .products-grid {

                grid-template-columns:
                    repeat(
                        4,
                        minmax(0, 1fr)
                    );

            }

        }


        @media (max-width: 1050px) {

            .products-grid {

                grid-template-columns:
                    repeat(
                        3,
                        minmax(0, 1fr)
                    );

                column-gap: 18px;

                row-gap: 55px;

            }


            .products-intro {

                padding-top: 90px;

            }

        }


        /* =====================================================
           MÓVIL
        ====================================================== */

        @media (max-width: 700px) {

            .products-page {

                width:
                    calc(
                        100% - 30px
                    );

            }


            .products-intro {

                padding-top: 95px;

                padding-bottom: 50px;

            }


            .products-intro h1 {

                font-size: 48px;

                letter-spacing: -2px;

            }


            .products-intro p {

                font-size: 13px;

            }


            .products-category-bar {

                margin-bottom: 30px;

                align-items: flex-start;

                gap: 18px;

            }


            .products-filter-row {

                gap: 6px;

            }


            .products-filter {

                padding: 7px 11px;

                font-size: 8px;

            }


            .products-grid {

                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );

                column-gap: 14px;

                row-gap: 45px;

            }


            .products-product-info {

                padding-top: 11px;

            }


            .products-product-category {

                font-size: 8px;

            }


            .products-product-name {

                font-size: 12px;

            }


            .products-product-price {

                font-size: 12px;

                margin-top: 5px;

            }


            .products-feature {

                margin-top: 80px;

                margin-bottom: 60px;

                min-height: 220px;

                padding: 30px 25px;

                border-radius: 8px;

            }


            .products-feature::before {

                width: 90px;

            }


            .products-feature::after {

                width: 90px;

            }


            .products-feature h2 {

                font-size: 32px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div id="satori-header"></div>


    <main>


        <div class="products-page">


            <!-- =================================================
                 INTRO
            ================================================== -->

            <section class="products-intro">

                <div class="products-intro-label">
                    SATORII · PRODUCTOS
                </div>


                <h1>
                    TODOS <span>LOS PRODUCTOS.</span>
                </h1>


                <p>
                    Descubre todo lo que tiene SATORII:
                    poleras, Anime Goods, Torii y mucho más.
                </p>

            </section>


            <!-- =================================================
                 CATEGORÍA
            ================================================== -->

            <div class="products-category-bar">

                <div>

                    <h2 class="products-category-title">
                        TODOS LOS PRODUCTOS
                    </h2>


                    <div class="products-filter-row">

                        <button
                            type="button"
                            class="products-filter active"
                            data-products-filter="all"
                        >
                            TODOS
                        </button>


                        <button
                            type="button"
                            class="products-filter"
                            data-products-filter="anime"
                        >
                            POLERAS
                        </button>


                        <button
                            type="button"
                            class="products-filter"
                            data-products-filter="anime-goods"
                        >
                            ANIME GOODS
                        </button>


                        <button
                            type="button"
                            class="products-filter"
                            data-products-filter="torii"
                        >
                            TORII
                        </button>

                    </div>

                </div>


                <span
                    class="products-product-count"
                    id="products-product-count"
                >
                    0 productos
                </span>

            </div>


            <!-- =================================================
                 PRODUCTOS
            ================================================== -->

            <section
                class="products-grid"
                id="products-grid"
            >
            </section>


            <!-- =================================================
                 PACK FINAL
            ================================================== -->

            <section class="products-feature">

                <div class="products-feature-content">

                    <div class="products-feature-label">
                        SATORII
                    </div>


                    <h2>
                        DESCUBRE
                        <span>SATORII.</span>
                    </h2>


                    <p>
                        Explora todas las colecciones de SATORII
                    en un solo lugar.
                    </p>

                </div>

            </section>


        </div>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div id="satori-footer"></div>


    <!-- =====================================================
         SCRIPTS
    ====================================================== -->

    <script src="js/products.js"></script>

    <script src="js/header.js"></script>

    <script src="js/footer.js"></script>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const grid =
                    document.getElementById(
                        "products-grid"
                    );

                const count =
                    document.getElementById(
                        "products-product-count"
                    );

                const filterButtons =
                    document.querySelectorAll(
                        ".products-filter"
                    );


                if (!grid) {

                    return;

                }


                if (
                    typeof PRODUCTS === "undefined" ||
                    !Array.isArray(PRODUCTS)
                ) {

                    grid.innerHTML = `

                        <div class="products-empty">

                            <strong>
                                No se pudo cargar el catálogo.
                            </strong>

                            Revisa que
                            js/products.js
                            esté disponible.

                        </div>

                    `;

                    return;

                }


                function normalizeCategory(
                    category
                ) {

                    return String(
                        category || ""
                    )
                    .toLowerCase()
                    .trim();

                }


                function renderProducts(
                    filter = "all"
                ) {

                    grid.innerHTML = "";


                    const filtered =
                        PRODUCTS.filter(
                            function (product) {

                                const category =
                                    normalizeCategory(
                                        product.category
                                    );


                                if (
                                    filter === "all"
                                ) {

                                    return true;

                                }


                                return (
                                    category === filter
                                );

                            }
                        );


                    count.textContent =
                        `${filtered.length} ${
                            filtered.length === 1
                                ? "producto"
                                : "productos"
                        }`;


                    if (
                        filtered.length === 0
                    ) {

                        grid.innerHTML = `

                            <div class="products-empty">

                                <strong>
                                    Próximamente
                                </strong>

                                Estamos preparando
                                nuevos productos SATORII.

                            </div>

                        `;

                        return;

                    }


                    filtered.forEach(
                        function (product) {

                            const primaryImage =
                                product.images?.[0] ||
                                product.image ||
                                "";

                            const secondaryImage =
                                product.images?.[1] ||
                                primaryImage;


                            const productId =
                                String(
                                    product.id ||
                                    product.name ||
                                    ""
                                )
                                .normalize("NFD")
                                .replace(
                                    /[̀-ͯ]/g,
                                    ""
                                )
                                .toLowerCase()
                                .trim()
                                .replace(
                                    /[^a-z0-9]+/g,
                                    "-"
                                )
                                .replace(
                                    /^-+|-+$/g,
                                    ""
                                );


                            const productCategory =
                                normalizeCategory(
                                    product.category
                                ) ||
                                "otros";


                            const productUrl =
                                "productos/" +
                                productCategory +
                                "/" +
                                productId +
                                ".html";


                            let price = "";


                            if (
                                product.price !== undefined &&
                                product.price !== null
                            ) {

                                price =
                                    new Intl.NumberFormat(
                                        "es-CL",
                                        {
                                            style:
                                                "currency",

                                            currency:
                                                "CLP",

                                            maximumFractionDigits:
                                                0
                                        }
                                    )
                                    .format(
                                        Number(
                                            product.price
                                        )
                                    );

                            }


                            const categoryLabel = {

                                anime:
                                    "POLERA",

                                "anime-goods":
                                    "ANIME GOODS",

                                torii:
                                    "TORII"

                            }[
                                productCategory
                            ] ||
                                productCategory
                                    .replace(
                                        /-/g,
                                        " "
                                    )
                                    .toUpperCase();


                            const card =
                                document.createElement(
                                    "a"
                                );


                            card.className =
                                "products-product";


                            card.href =
                                productUrl;


                            card.innerHTML = `

                                <div
                                    class="
                                        products-product-image
                                    "
                                >

                                    <img
                                        class="image-primary"
                                        src="${primaryImage}"
                                        alt="${
                                            product.name ||
                                            "Producto SATORII"
                                        }"
                                        loading="lazy"
                                    >


                                    <img
                                        class="image-secondary"
                                        src="${secondaryImage}"
                                        alt="${
                                            product.name ||
                                            "Producto SATORII"
                                        }"
                                        loading="lazy"
                                    >

                                </div>


                                <div
                                    class="
                                        products-product-info
                                    "
                                >

                                    <div
                                        class="
                                            products-product-category
                                        "
                                    >
                                        ${categoryLabel}
                                    </div>


                                    <h3
                                        class="
                                            products-product-name
                                        "
                                    >
                                        ${
                                            product.name ||
                                            "Producto"
                                        }
                                    </h3>


                                    <div
                                        class="
                                            products-product-price
                                        "
                                    >
                                        ${price}
                                    </div>

                                </div>

                            `;


                            grid.appendChild(
                                card
                            );

                        }
                    );

                }


                renderProducts();


                filterButtons.forEach(
                    function (button) {

                        button.addEventListener(
                            "click",
                            function () {

                                filterButtons
                                    .forEach(
                                        function (item) {

                                            item.classList.remove(
                                                "active"
                                            );

                                        }
                                    );


                                button.classList.add(
                                    "active"
                                );


                                renderProducts(
                                    button.dataset.productsFilter
                                );

                            }
                        );

                    }
                );

            }
        );

    </script>


</body>

</html>
