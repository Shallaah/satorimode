<!DOCTYPE html>
<html lang="es">

<head>

    <link
        rel="icon"
        type="image/png"
        href="img/logo.webp"
    >

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="SATORII — Descubre todos nuestros productos."
    >

    <title>Productos | SATORII</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <style>

        /* =====================================================
           SATORII · CATÁLOGO DE PRODUCTOS
        ====================================================== */

        .products-page {

            width: min(
                var(--satori-content-width, 1800px),
                calc(
                    100% -
                    (
                        var(--satori-side-space, 30px) * 2
                    )
                )
            );

            margin-left: auto;
            margin-right: auto;

            box-sizing: border-box;

        }


        /* =====================================================
           INTRO
        ====================================================== */

        .products-intro {

            padding-top: 110px;
            padding-bottom: 70px;

            text-align: center;

        }


        .products-intro-label {

            margin-bottom: 16px;

            color:
                var(--red, #EF0930);

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 4px;

        }


        .products-intro h1 {

            margin: 0;

            font-size: clamp(
                48px,
                6vw,
                88px
            );

            line-height: .95;

            font-weight: 900;

            letter-spacing: -4px;

            color: #111;

        }


        .products-intro h1 span {

            color:
                var(--red, #EF0930);

        }


        .products-intro p {

            max-width: 650px;

            margin: 25px auto 0;

            color: #666;

            font-size: 15px;

            line-height: 1.7;

        }


        /* =====================================================
           CONTROLES
        ====================================================== */

        .products-controls {

            margin-bottom: 45px;

            padding-bottom: 24px;

            border-bottom:
                1px solid #ddd;

        }


        /* =====================================================
           CABECERA
        ====================================================== */

        .products-category-bar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 20px;

        }


        .products-category-title {

            margin: 0;

            font-size: 14px;

            font-weight: 800;

            letter-spacing: 1px;

        }


        .products-product-count {

            color: #777;

            font-size: 12px;

            white-space: nowrap;

        }


        /* =====================================================
           BOTÓN FILTROS
        ====================================================== */

        .products-filter-toggle {

            width: 100%;

            min-height: 48px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 16px;

            background: #fff;

            border:
                1px solid #ddd;

            border-radius: 6px;

            color: #111;

            font-family: inherit;

            font-size: 10px;

            font-weight: 900;

            letter-spacing: 1.5px;

            cursor: pointer;

            transition:
                border-color .2s ease,
                background .2s ease;

        }


        .products-filter-toggle:hover {

            border-color: #999;

        }


        .products-filter-toggle-icon {

            font-size: 18px;

            line-height: 1;

            transition:
                transform .25s ease;

        }


        .products-filter-toggle.active {

            background: #111;

            border-color: #111;

            color: #fff;

        }


        .products-filter-toggle.active
        .products-filter-toggle-icon {

            transform:
                rotate(45deg);

        }


        /* =====================================================
           PANEL DE FILTROS
        ====================================================== */

        .products-filter-panel {

            display: none;

            margin-top: 14px;

            padding: 22px;

            background: #fafafa;

            border:
                1px solid #e4e4e4;

            border-radius: 8px;

        }


        .products-filter-panel.open {

            display: block;

        }


        /* =====================================================
           SECCIÓN DE FILTRO
        ====================================================== */

        .products-filter-section {

            margin-bottom: 22px;

        }


        .products-filter-section:last-child {

            margin-bottom: 0;

        }


        .products-filter-label {

            display: block;

            margin-bottom: 10px;

            color: #777;

            font-size: 9px;

            font-weight: 900;

            letter-spacing: 1.5px;

        }


        /* =====================================================
           FILTROS
        ====================================================== */

        .products-filter-row {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

        }


        .products-filter {

            padding:
                9px 15px;

            background: #fff;

            border:
                1px solid #ddd;

            border-radius: 999px;

            color: #666;

            font-family: inherit;

            font-size: 9px;

            font-weight: 800;

            letter-spacing: 1px;

            cursor: pointer;

            transition:
                background .2s ease,
                border-color .2s ease,
                color .2s ease,
                transform .2s ease;

        }


        .products-filter:hover {

            border-color:
                #999;

            color: #111;

        }


        .products-filter.active {

            background: #111;

            border-color: #111;

            color: #fff;

            transform:
                translateY(-1px);

        }


        /* =====================================================
           ORDEN
        ====================================================== */

        .products-sort {

            width: 100%;

            height: 42px;

            padding:
                0 12px;

            border:
                1px solid #ddd;

            border-radius: 5px;

            background: #fff;

            color: #111;

            font-family: inherit;

            font-size: 10px;

            cursor: pointer;

            outline: none;

        }


        .products-sort:focus {

            border-color:
                #111;

        }


        /* =====================================================
           LIMPIAR
        ====================================================== */

        .products-clear {

            margin-top: 18px;

            padding: 0;

            border: 0;

            background: transparent;

            color:
                var(--red, #EF0930);

            font-family: inherit;

            font-size: 9px;

            font-weight: 900;

            letter-spacing: 1px;

            cursor: pointer;

        }


        .products-clear:hover {

            text-decoration: underline;

            text-underline-offset: 3px;

        }


        /* =====================================================
           GRID
        ====================================================== */

        .products-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    5,
                    minmax(0, 1fr)
                );

            column-gap: 22px;

            row-gap: 75px;

            width: 100%;

        }


        /* =====================================================
           PRODUCTO
        ====================================================== */

        .products-product {

            display: block;

            min-width: 0;

            text-decoration: none;

            color: inherit;

            cursor: pointer;

        }


        /* =====================================================
           IMAGEN
        ====================================================== */

        .products-product-image {

            position: relative;

            width: 100%;

            aspect-ratio: 1 / 1;

            overflow: hidden;

            background: #f7f7f7;

            border-radius: 8px;

        }


        .products-product-image img {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

            transition:
                opacity .35s ease,
                transform .45s ease;

        }


        .products-product-image
        .image-primary {

            opacity: 1;

        }


        .products-product-image
        .image-secondary {

            opacity: 0;

        }


        /* =====================================================
           HOVER
        ====================================================== */

        .products-product:hover
        .products-product-image
        .image-primary {

            opacity: 0;

        }


        .products-product:hover
        .products-product-image
        .image-secondary {

            opacity: 1;

        }


        .products-product:hover
        .products-product-image img {

            transform:
                scale(1.025);

        }


        /* =====================================================
           INFORMACIÓN
        ====================================================== */

        .products-product-info {

            padding-top: 16px;

        }


        .products-product-category {

            margin-bottom: 6px;

            color:
                var(--red, #EF0930);

            font-size: 9px;

            font-weight: 800;

            letter-spacing: 1.5px;

            text-transform: uppercase;

        }


        .products-product-name {

            margin: 0;

            color: #111;

            font-size: 14px;

            line-height: 1.3;

            font-weight: 600;

        }


        .products-product-price {

            margin-top: 7px;

            color: #111;

            font-size: 14px;

            font-weight: 700;

        }


        /* =====================================================
           BADGES
        ====================================================== */

        .products-product-badges {

            position: absolute;

            top: 10px;

            left: 10px;

            display: flex;

            flex-wrap: wrap;

            gap: 5px;

            z-index: 3;

        }


        .products-product-badge {

            padding:
                5px 8px;

            background: #111;

            color: #fff;

            border-radius: 3px;

            font-size: 7px;

            font-weight: 900;

            letter-spacing: 1px;

        }


        .products-product-badge.new {

            background:
                var(--red, #EF0930);

        }


        /* =====================================================
           SIN PRODUCTOS
        ====================================================== */

        .products-empty {

            grid-column:
                1 / -1;

            padding:
                100px 20px;

            text-align: center;

            color: #777;

        }


        .products-empty strong {

            display: block;

            margin-bottom: 10px;

            color: #111;

            font-size: 20px;

        }


        /* =====================================================
           PACK FINAL
        ====================================================== */

        .products-feature {

            position: relative;

            margin-top: 120px;

            margin-bottom: 100px;

            min-height: 230px;

            padding: 50px;

            display: flex;

            align-items: center;

            box-sizing: border-box;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #111827 0%,
                    #090d15 100%
                );

            color: #fff;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .18
                );

            border-radius: 10px;

        }


        .products-feature::before {

            content: "";

            position: absolute;

            top: 0;

            left: 0;

            width: 150px;

            height: 2px;

            background:
                var(--red, #EF0930);

        }


        .products-feature::after {

            content: "";

            position: absolute;

            bottom: 0;

            right: 0;

            width: 150px;

            height: 2px;

            background:
                var(--red, #EF0930);

        }


        .products-feature-content {

            position: relative;

            z-index: 2;

            max-width: 650px;

        }


        .products-feature-label {

            margin-bottom: 8px;

            color:
                var(--red, #EF0930);

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 4px;

        }


        .products-feature h2 {

            margin:
                0 0 12px;

            font-size:
                clamp(
                    30px,
                    4vw,
                    52px
                );

            line-height: 1;

            font-weight: 900;

        }


        .products-feature h2 span {

            color:
                var(--red, #EF0930);

        }


        .products-feature p {

            margin: 0;

            color: #ccc;

            font-size: 14px;

            line-height: 1.6;

        }


        /* =====================================================
           TABLET
        ====================================================== */

        @media (max-width: 1400px) {

            .products-grid {

                grid-template-columns:
                    repeat(
                        4,
                        minmax(0, 1fr)
                    );

            }

        }


        @media (max-width: 1050px) {

            .products-grid {

                grid-template-columns:
                    repeat(
                        3,
                        minmax(0, 1fr)
                    );

                column-gap: 18px;

                row-gap: 55px;

            }


            .products-intro {

                padding-top: 90px;

            }

        }


        /* =====================================================
           MÓVIL
        ====================================================== */

        @media (max-width: 700px) {

            .products-page {

                width:
                    calc(
                        100% - 30px
                    );

            }


            .products-intro {

                padding-top: 95px;

                padding-bottom: 50px;

            }


            .products-intro h1 {

                font-size: 48px;

                letter-spacing: -2px;

            }


            .products-intro p {

                font-size: 13px;

            }


            .products-category-bar {

                align-items:
                    flex-start;

            }


            .products-grid {

                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );

                column-gap: 14px;

                row-gap: 45px;

            }


            .products-product-info {

                padding-top: 11px;

            }


            .products-product-category {

                font-size: 8px;

            }


            .products-product-name {

                font-size: 12px;

            }


            .products-product-price {

                font-size: 12px;

                margin-top: 5px;

            }


            .products-feature {

                margin-top: 80px;

                margin-bottom: 60px;

                min-height: 220px;

                padding:
                    30px 25px;

                border-radius: 8px;

            }


            .products-feature h2 {

                font-size: 32px;

            }


            .products-filter-panel {

                padding: 18px;

            }

        }


        @media (max-width: 420px) {

            .products-category-bar {

                flex-direction:
                    column;

            }


            .products-product-count {

                align-self:
                    flex-start;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div id="satori-header"></div>


    <main>


        <div class="products-page">


            <!-- =================================================
                 INTRO
            ================================================== -->

            <section class="products-intro">

                <div class="products-intro-label">
                    SATORII · PRODUCTOS
                </div>


                <h1>

                    TODOS
                    <span>
                        LOS PRODUCTOS.
                    </span>

                </h1>


                <p>

                    Descubre todo lo que tiene SATORII
                    y encuentra aquello que representa
                    tu universo.

                </p>

            </section>


            <!-- =================================================
                 CONTROLES
            ================================================== -->

            <section class="products-controls">


                <div class="products-category-bar">

                    <h2
                        class="products-category-title"
                        id="products-category-title"
                    >
                        TODOS LOS PRODUCTOS
                    </h2>


                    <span
                        class="products-product-count"
                        id="products-product-count"
                    >
                        0 productos
                    </span>

                </div>


                <!-- =================================================
                     FILTROS
                ================================================== -->

                <button
                    type="button"
                    class="products-filter-toggle"
                    id="products-filter-toggle"
                >

                    <span>
                        FILTROS
                    </span>


                    <span
                        class="products-filter-toggle-icon"
                    >
                        +
                    </span>

                </button>


                <div
                    class="products-filter-panel"
                    id="products-filter-panel"
                >


                    <!-- =================================================
                         CATEGORÍA
                    ================================================== -->

                    <div class="products-filter-section">

                        <span class="products-filter-label">
                            CATEGORÍA
                        </span>


                        <div
                            class="products-filter-row"
                            id="products-category-filters"
                        >

                            <button
                                type="button"
                                class="products-filter active"
                                data-filter-type="category"
                                data-filter-value=""
                            >
                                TODOS
                            </button>

                        </div>

                    </div>


                    <!-- =================================================
                         COLOR
                    ================================================== -->

                    <div
                        class="products-filter-section"
                        id="products-color-section"
                    >

                        <span class="products-filter-label">
                            COLOR
                        </span>


                        <div
                            class="products-filter-row"
                            id="products-color-filters"
                        >
                        </div>

                    </div>


                    <!-- =================================================
                         ORDEN
                    ================================================== -->

                    <div class="products-filter-section">

                        <span class="products-filter-label">
                            ORDENAR
                        </span>


                        <select
                            class="products-sort"
                            id="products-sort"
                        >

                            <option value="featured">
                                Destacados
                            </option>

                            <option value="price-asc">
                                Precio: menor a mayor
                            </option>

                            <option value="price-desc">
                                Precio: mayor a menor
                            </option>

                            <option value="name-asc">
                                Nombre: A → Z
                            </option>

                        </select>

                    </div>


                    <!-- =================================================
                         LIMPIAR
                    ================================================== -->

                    <button
                        type="button"
                        class="products-clear"
                        id="products-clear"
                    >
                        LIMPIAR FILTROS
                    </button>


                </div>

            </section>


            <!-- =================================================
                 GRID
            ================================================== -->

            <section
                class="products-grid"
                id="products-grid"
            >
            </section>


            <!-- =================================================
                 PACK FINAL
            ================================================== -->

            <section class="products-feature">

                <div class="products-feature-content">

                    <div class="products-feature-label">
                        SATORII
                    </div>


                    <h2>

                        DESCUBRE
                        <span>
                            SATORII.
                        </span>

                    </h2>


                    <p>

                        Explora todas las colecciones
                        de SATORII en un solo lugar.

                    </p>

                </div>

            </section>


        </div>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div id="satori-footer"></div>


    <!-- =====================================================
         SCRIPTS
    ====================================================== -->

    <script src="js/products.js"></script>

    <script src="js/header.js"></script>

    <script src="js/footer.js"></script>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                "use strict";


                /* =================================================
                   ELEMENTOS
                ================================================= */

                const grid =
                    document.getElementById(
                        "products-grid"
                    );


                const count =
                    document.getElementById(
                        "products-product-count"
                    );


                const categoryFilters =
                    document.getElementById(
                        "products-category-filters"
                    );


                const colorFilters =
                    document.getElementById(
                        "products-color-filters"
                    );


                const colorSection =
                    document.getElementById(
                        "products-color-section"
                    );


                const sortSelect =
                    document.getElementById(
                        "products-sort"
                    );


                const clearButton =
                    document.getElementById(
                        "products-clear"
                    );


                const filterToggle =
                    document.getElementById(
                        "products-filter-toggle"
                    );


                const filterPanel =
                    document.getElementById(
                        "products-filter-panel"
                    );


                const categoryTitle =
                    document.getElementById(
                        "products-category-title"
                    );


                /* =================================================
                   COMPROBAR PRODUCTS
                ================================================== */

                if (
                    typeof PRODUCTS === "undefined" ||
                    !Array.isArray(PRODUCTS)
                ) {

                    if (grid) {

                        grid.innerHTML = `

                            <div class="products-empty">

                                <strong>
                                    No se pudo cargar el catálogo.
                                </strong>

                                Revisa que
                                js/products.js
                                esté disponible.

                            </div>

                        `;

                    }

                    return;

                }


                /* =================================================
                   COMPROBAR FUNCIÓN NUEVO
                ================================================== */

                if (
                    typeof isProductNew !== "function"
                ) {

                    console.warn(
                        "SatoriMode · isProductNew() no está disponible."
                    );

                }


                /* =================================================
                   ESTADO
                ================================================= */

                const state = {

                    category: "",

                    color: "",

                    sort: "featured"

                };


                /* =================================================
                   NORMALIZAR
                ================================================= */

                function normalize(value) {

                    return String(
                        value || ""
                    )
                    .normalize("NFD")
                    .replace(
                        /[\u0300-\u036f]/g,
                        ""
                    )
                    .toLowerCase()
                    .trim();

                }


                /* =================================================
                   ESCAPAR HTML
                ================================================= */

                function escapeHTML(value) {

                    return String(
                        value ?? ""
                    )
                    .replace(
                        /&/g,
                        "&amp;"
                    )
                    .replace(
                        /</g,
                        "&lt;"
                    )
                    .replace(
                        />/g,
                        "&gt;"
                    )
                    .replace(
                        /"/g,
                        "&quot;"
                    )
                    .replace(
                        /'/g,
                        "&#039;"
                    );

                }


                /* =================================================
                   PRECIO
                ================================================= */

                function formatPrice(value) {

                    return new Intl.NumberFormat(
                        "es-CL",
                        {
                            style:
                                "currency",

                            currency:
                                "CLP",

                            maximumFractionDigits:
                                0
                        }
                    )
                    .format(
                        Number(value) || 0
                    );

                }


                /* =================================================
                   VALORES ÚNICOS
                ================================================= */

                function uniqueArrayValues(
                    products,
                    property
                ) {

                    const values = [];


                    products.forEach(
                        function (product) {

                            const propertyValue =
                                product[property];


                            if (
                                !Array.isArray(
                                    propertyValue
                                )
                            ) {

                                return;

                            }


                            propertyValue.forEach(
                                function (value) {

                                    if (
                                        !value
                                    ) {

                                        return;

                                    }


                                    const exists =
                                        values.some(
                                            function (
                                                existing
                                            ) {

                                                return (
                                                    normalize(
                                                        existing
                                                    ) ===
                                                    normalize(
                                                        value
                                                    )
                                                );

                                            }
                                        );


                                    if (
                                        !exists
                                    ) {

                                        values.push(
                                            value
                                        );

                                    }

                                }
                            );

                        }
                    );


                    return values;

                }


                /* =================================================
                   CREAR BOTÓN
                ================================================== */

                function createFilterButton(
                    label,
                    value,
                    type
                ) {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.type =
                        "button";


                    button.className =
                        "products-filter";


                    button.textContent =
                        String(
                            label
                        ).toUpperCase();


                    button.dataset.filterType =
                        type;


                    button.dataset.filterValue =
                        value;


                    return button;

                }


                /* =================================================
                   CONSTRUIR FILTROS
                ================================================== */

                function buildFilters() {

                    /* =============================================
                       CATEGORÍAS

                       Ahora vienen directamente de PRODUCTS.
                    ============================================== */

                    const categories = [

                        ...new Set(

                            PRODUCTS
                                .map(
                                    function (
                                        product
                                    ) {

                                        return product.category;

                                    }
                                )
                                .filter(Boolean)

                        )

                    ];


                    categories.forEach(
                        function (category) {

                            const button =
                                createFilterButton(
                                    category,
                                    category,
                                    "category"
                                );


                            categoryFilters
                                .appendChild(
                                    button
                                );

                        }
                    );


                    /* =============================================
                       COLORES
                    ============================================== */

                    const colors =
                        uniqueArrayValues(
                            PRODUCTS,
                            "colors"
                        );


                    colors.forEach(
                        function (color) {

                            const button =
                                createFilterButton(
                                    color,
                                    color,
                                    "color"
                                );


                            colorFilters
                                .appendChild(
                                    button
                                );

                        }
                    );


                    if (
                        !colors.length
                    ) {

                        colorSection.style.display =
                            "none";

                    }

                }


                /* =================================================
                   FILTRAR PRODUCTOS
                ================================================== */

                function getFilteredProducts() {

                    let result =
                        PRODUCTS.filter(
                            function (product) {

                                return (
                                    product.available ===
                                    true
                                );

                            }
                        );


                    /* =============================================
                       CATEGORÍA
                    ============================================== */

                    if (
                        state.category
                    ) {

                        result =
                            result.filter(
                                function (product) {

                                    return (
                                        normalize(
                                            product.category
                                        ) ===
                                        normalize(
                                            state.category
                                        )
                                    );

                                }
                            );

                    }


                    /* =============================================
                       COLOR
                    ============================================== */

                    if (
                        state.color
                    ) {

                        result =
                            result.filter(
                                function (product) {

                                    if (
                                        !Array.isArray(
                                            product.colors
                                        )
                                    ) {

                                        return false;

                                    }


                                    return product.colors.some(
                                        function (color) {

                                            return (
                                                normalize(
                                                    color
                                                ) ===
                                                normalize(
                                                    state.color
                                                )
                                            );

                                        }
                                    );

                                }
                            );

                    }


                    /* =============================================
                       ORDEN
                    ============================================== */

                    if (
                        state.sort ===
                        "price-asc"
                    ) {

                        result.sort(
                            function (
                                a,
                                b
                            ) {

                                return (
                                    Number(
                                        a.price
                                    ) || 0
                                ) -
                                (
                                    Number(
                                        b.price
                                    ) || 0
                                );

                            }
                        );

                    }

                    else if (
                        state.sort ===
                        "price-desc"
                    ) {

                        result.sort(
                            function (
                                a,
                                b
                            ) {

                                return (
                                    Number(
                                        b.price
                                    ) || 0
                                ) -
                                (
                                    Number(
                                        a.price
                                    ) || 0
                                );

                            }
                        );

                    }

                    else if (
                        state.sort ===
                        "name-asc"
                    ) {

                        result.sort(
                            function (
                                a,
                                b
                            ) {

                                return String(
                                    a.name || ""
                                ).localeCompare(
                                    String(
                                        b.name || ""
                                    ),
                                    "es",
                                    {
                                        sensitivity:
                                            "base"
                                    }
                                );

                            }
                        );

                    }

                    else {

                        result.sort(
                            function (
                                a,
                                b
                            ) {

                                return (
                                    Number(
                                        b.featured ===
                                        true
                                    ) -
                                    Number(
                                        a.featured ===
                                        true
                                    )
                                );

                            }
                        );

                    }


                    return result;

                }


                /* =================================================
                   CREAR RUTA DEL PRODUCTO
                ================================================== */

                function getProductUrl(
                    product
                ) {

                    /*
                     * Si el producto tiene URL definida,
                     * usamos esa URL.
                     */

                    if (
                        product &&
                        product.url
                    ) {

                        const cleanUrl =
                            String(
                                product.url
                            )
                            .trim()
                            .replace(
                                /^\/+/,
                                ""
                            );


                        /*
                         * Si ya viene con /satorimode/,
                         * no lo duplicamos.
                         */

                        if (
                            cleanUrl.startsWith(
                                "satorimode/"
                            )
                        ) {

                            return "/" +
                                cleanUrl;

                        }


                        return (
                            "/satorimode/" +
                            cleanUrl
                        );

                    }


                    /*
                     * Fallback automático.
                     */

                    const category =
                        normalize(
                            product.category
                        );


                    const productId =
                        String(
                            product.id ||
                            product.name ||
                            ""
                        )
                        .normalize("NFD")
                        .replace(
                            /[\u0300-\u036f]/g,
                            ""
                        )
                        .toLowerCase()
                        .trim()
                        .replace(
                            /[^a-z0-9]+/g,
                            "-"
                        )
                        .replace(
                            /^-+|-+$/g,
                            ""
                        );


                    return (
                        "/satorimode/" +
                        "productos/" +
                        category +
                        "/" +
                        productId +
                        ".html"
                    );

                }


                /* =================================================
                   RENDER
                ================================================== */

                function renderProducts() {

                    const products =
                        getFilteredProducts();


                    grid.innerHTML =
                        "";


                    count.textContent =
                        `${products.length} ${
                            products.length === 1
                                ? "producto"
                                : "productos"
                        }`;


                    if (
                        state.category
                    ) {

                        categoryTitle.textContent =
                            String(
                                state.category
                            )
                            .replace(
                                /-/g,
                                " "
                            )
                            .toUpperCase();

                    }

                    else {

                        categoryTitle.textContent =
                            "TODOS LOS PRODUCTOS";

                    }


                    /* =============================================
                       VACÍO
                    ============================================== */

                    if (
                        products.length === 0
                    ) {

                        grid.innerHTML = `

                            <div class="products-empty">

                                <strong>
                                    No encontramos productos.
                                </strong>

                                Prueba con otros filtros.

                            </div>

                        `;

                        return;

                    }


                    /* =============================================
                       TARJETAS
                    ============================================== */

                    products.forEach(
                        function (product) {

                            const primaryImage =
                                product.images?.[0] ||
                                product.image ||
                                "";


                            const secondaryImage =
                                product.images?.[1] ||
                                primaryImage;


                            const productUrl =
                                getProductUrl(
                                    product
                                );


                            const card =
                                document.createElement(
                                    "a"
                                );


                            card.className =
                                "products-product";


                            card.href =
                                productUrl;


                            /*
                             * Permite también abrir con teclado.
                             */

                            card.setAttribute(
                                "aria-label",
                                `Ver ${product.name || "producto"}`
                            );


                            const categoryLabel =
                                String(
                                    product.subcategory ||
                                    product.collection ||
                                    product.category ||
                                    ""
                                )
                                .replace(
                                    /-/g,
                                    " "
                                )
                                .toUpperCase();


                            /* =====================================
                               BADGE NUEVO

                               IMPORTANTE:
                               Ahora respeta releaseDate + newDays.
                            ====================================== */

                            let badges = "";


                            const productIsNew =
                                typeof isProductNew ===
                                "function"
                                    ? isProductNew(
                                        product
                                    )
                                    : product.newProduct ===
                                      true;


                            if (
                                productIsNew
                            ) {

                                badges = `

                                    <div
                                        class="
                                            products-product-badges
                                        "
                                    >

                                        <span
                                            class="
                                                products-product-badge
                                                new
                                            "
                                        >
                                            NUEVO
                                        </span>

                                    </div>

                                `;

                            }


                            card.innerHTML = `

                                <div
                                    class="
                                        products-product-image
                                    "
                                >

                                    ${badges}


                                    ${
                                        primaryImage
                                            ? `
                                                <img
                                                    class="
                                                        image-primary
                                                    "
                                                    src="${escapeHTML(
                                                        primaryImage
                                                    )}"
                                                    alt="${escapeHTML(
                                                        product.name ||
                                                        "Producto SATORII"
                                                    )}"
                                                    loading="lazy"
                                                >
                                            `
                                            : ""
                                    }


                                    ${
                                        secondaryImage
                                            ? `
                                                <img
                                                    class="
                                                        image-secondary
                                                    "
                                                    src="${escapeHTML(
                                                        secondaryImage
                                                    )}"
                                                    alt="${escapeHTML(
                                                        product.name ||
                                                        "Producto SATORII"
                                                    )}"
                                                    loading="lazy"
                                                >
                                            `
                                            : ""
                                    }

                                </div>


                                <div
                                    class="
                                        products-product-info
                                    "
                                >

                                    <div
                                        class="
                                            products-product-category
                                        "
                                    >

                                        ${escapeHTML(
                                            categoryLabel
                                        )}

                                    </div>


                                    <h3
                                        class="
                                            products-product-name
                                        "
                                    >

                                        ${escapeHTML(
                                            product.name ||
                                            "Producto"
                                        )}

                                    </h3>


                                    <div
                                        class="
                                            products-product-price
                                        "
                                    >

                                        ${formatPrice(
                                            product.price
                                        )}

                                    </div>

                                </div>

                            `;


                            grid.appendChild(
                                card
                            );

                        }
                    );

                }


                /* =================================================
                   ACTUALIZAR BOTONES
                ================================================== */

                function updateFilterButtons() {

                    document
                        .querySelectorAll(
                            "[data-filter-type]"
                        )
                        .forEach(
                            function (button) {

                                const type =
                                    button.dataset.filterType;


                                const value =
                                    button.dataset.filterValue ||
                                    "";


                                let active =
                                    false;


                                if (
                                    type ===
                                    "category"
                                ) {

                                    active =
                                        normalize(
                                            state.category
                                        ) ===
                                        normalize(
                                            value
                                        );

                                }


                                if (
                                    type ===
                                    "color"
                                ) {

                                    active =
                                        normalize(
                                            state.color
                                        ) ===
                                        normalize(
                                            value
                                        );

                                }


                                button.classList.toggle(
                                    "active",
                                    active
                                );

                            }
                        );

                }


                /* =================================================
                   CLICK FILTROS
                ================================================== */

                document.addEventListener(
                    "click",
                    function (event) {

                        const button =
                            event.target.closest(
                                "[data-filter-type]"
                            );


                        if (!button) {

                            return;

                        }


                        const type =
                            button.dataset.filterType;


                        const value =
                            button.dataset.filterValue ||
                            "";


                        if (
                            type ===
                            "category"
                        ) {

                            state.category =
                                value;

                        }


                        if (
                            type ===
                            "color"
                        ) {

                            state.color =
                                value;

                        }


                        updateFilterButtons();

                        renderProducts();

                    }
                );


                /* =================================================
                   ORDEN
                ================================================== */

                sortSelect.addEventListener(
                    "change",
                    function () {

                        state.sort =
                            this.value;

                        renderProducts();

                    }
                );


                /* =================================================
                   LIMPIAR
                ================================================== */

                clearButton.addEventListener(
                    "click",
                    function () {

                        state.category =
                            "";

                        state.color =
                            "";

                        state.sort =
                            "featured";


                        sortSelect.value =
                            "featured";


                        updateFilterButtons();

                        renderProducts();

                    }
                );


                /* =================================================
                   ABRIR / CERRAR FILTROS
                ================================================== */

                filterToggle.addEventListener(
                    "click",
                    function () {

                        const isOpen =
                            filterPanel.classList.toggle(
                                "open"
                            );


                        filterToggle.classList.toggle(
                            "active",
                            isOpen
                        );

                    }
                );


                /* =================================================
                   INICIAR
                ================================================= */

                buildFilters();

                updateFilterButtons();

                renderProducts();

            }
        );

    </script>


</body>
