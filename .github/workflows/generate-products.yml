name: Generar páginas de productos

on:
  push:
    paths:
      - "js/products.js"
      - "scripts/generate-products.js"
      - "scripts/optimize-images.js"
      - "package.json"
      - "package-lock.json"
      - "img/**"
      - ".github/workflows/generate-products.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  generate:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "SatoriMode Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
        
      - name: Instalar dependencias
        run: npm install

      - name: Optimizar imágenes
        run: |
          echo "========================================"
          echo "Optimizando imágenes"
          echo "========================================"

          npm run optimize-images

       - name: Actualizar referencias WebP
        run: node scripts/update-image-references.js

      - name: Verificar generate-products.js
        run: |
          echo "========================================"
          echo "Verificando generate-products.js"
          echo "========================================"

          node --version

          node --check scripts/generate-products.js

          echo "✓ generate-products.js tiene sintaxis válida."

      - name: Generar páginas
        run: |
          echo "========================================"
          echo "Generando páginas de productos"
          echo "========================================"

          npm run generate-products

      - name: Guardar archivos generados
        run: |

          git add productos img

          if git diff --cached --quiet; then
            echo "No hay cambios generados."
            exit 0
          fi

          git commit -m "Optimizar imágenes y generar páginas de productos"

          git pull --rebase origin main

          git push origin main
