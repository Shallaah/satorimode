<!DOCTYPE html>
<html lang="es">

<head>

    <link
        rel="icon"
        type="image/png"
        href="img/logo.png"
    >

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="SATORII Torii — Colección inspirada en la estética, símbolos y cultura japonesa."
    >

    <title>Torii | SATORII</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <style>

        /* =====================================================
           ANIME — ESTRUCTURA
        ====================================================== */

        .torii-page {

            width: min(
                var(--satori-content-width, 1800px),
                calc(
                    100% -
                    (
                        var(--satori-side-space, 30px) * 2
                    )
                )
            );

            margin-left: auto;
            margin-right: auto;

            box-sizing: border-box;

        }


        /* =====================================================
           INTRO
        ====================================================== */

        .torii-intro {

            padding-top: 110px;
            padding-bottom: 70px;

            text-align: center;

        }


        .torii-intro-label {

            margin-bottom: 16px;

            color: var(
                --red,
                #ff1b1b
            );

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 4px;

        }


        .torii-intro h1 {

            margin: 0;

            font-size: clamp(
                48px,
                6vw,
                88px
            );

            line-height: .95;

            font-weight: 900;

            letter-spacing: -4px;

            color: #111;

        }


        .torii-intro h1 span {

            color: var(
                --red,
                #ff1b1b
            );

        }


        .torii-intro p {

            max-width: 650px;

            margin: 25px auto 0;

            color: #666;

            font-size: 15px;

            line-height: 1.7;

        }


        /* =====================================================
           BARRA DE CATEGORÍA
        ====================================================== */

        .torii-category-bar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 45px;

            padding-bottom: 18px;

            border-bottom: 1px solid #ddd;

        }


        .torii-category-title {

            margin: 0;

            font-size: 14px;

            font-weight: 800;

            letter-spacing: 1px;

        }


        .torii-product-count {

            color: #777;

            font-size: 12px;

        }


        /* =====================================================
           GRID
        ====================================================== */

        .torii-products-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    5,
                    minmax(0, 1fr)
                );

            column-gap: 22px;

            row-gap: 75px;

            width: 100%;

        }


        /* =====================================================
           PRODUCTO
        ====================================================== */

        .torii-product {

            display: block;

            min-width: 0;

            text-decoration: none;

            color: inherit;

        }


        /* =====================================================
           IMÁGENES
        ====================================================== */

        .torii-product-image {

            position: relative;

            width: 100%;

            aspect-ratio: 1 / 1;

            overflow: hidden;

            background: #f7f7f7;

            border-radius: 8px;

        }


        .torii-product-image img {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

            transition:
                opacity .35s ease,
                transform .45s ease;

        }


        .torii-product-image
        .image-primary {

            opacity: 1;

        }


        .torii-product-image
        .image-secondary {

            opacity: 0;

        }


        /* =====================================================
           HOVER
        ====================================================== */

        .torii-product:hover
        .torii-product-image
        .image-primary {

            opacity: 0;

        }


        .torii-product:hover
        .torii-product-image
        .image-secondary {

            opacity: 1;

        }


        .torii-product:hover
        .torii-product-image img {

            transform: scale(
                1.025
            );

        }


        /* =====================================================
           INFORMACIÓN
        ====================================================== */

        .torii-product-info {

            padding-top: 16px;

        }


        .torii-product-category {

            margin-bottom: 6px;

            color: var(
                --red,
                #ff1b1b
            );

            font-size: 9px;

            font-weight: 800;

            letter-spacing: 1.5px;

            text-transform: uppercase;

        }


        .torii-product-name {

            margin: 0;

            color: #111;

            font-size: 14px;

            line-height: 1.3;

            font-weight: 600;

        }


        .torii-product-price {

            margin-top: 7px;

            color: #111;

            font-size: 14px;

            font-weight: 700;

        }


        /* =====================================================
           SIN PRODUCTOS
        ====================================================== */

        .torii-empty {

            grid-column: 1 / -1;

            padding: 100px 20px;

            text-align: center;

            color: #777;

        }


        .torii-empty strong {

            display: block;

            margin-bottom: 10px;

            color: #111;

            font-size: 20px;

        }


        /* =====================================================
           PACK FINAL
        ====================================================== */

        .torii-feature {

            position: relative;

            margin-top: 120px;

            margin-bottom: 100px;

            min-height: 230px;

            padding: 50px;

            display: flex;

            align-items: center;

            box-sizing: border-box;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #111827 0%,
                    #090d15 100%
                );

            color: #fff;

            border: 1px solid
                rgba(
                    255,
                    255,
                    255,
                    .18
                );

            border-radius: 10px;

        }


        .torii-feature::before {

            content: "";

            position: absolute;

            top: 0;

            left: 0;

            width: 150px;

            height: 2px;

            background:
                var(
                    --red,
                    #ff1b1b
                );

        }


        .torii-feature::after {

            content: "";

            position: absolute;

            bottom: 0;

            right: 0;

            width: 150px;

            height: 2px;

            background:
                var(
                    --red,
                    #ff1b1b
                );

        }


        .torii-feature-content {

            position: relative;

            z-index: 2;

            max-width: 650px;

        }


        .torii-feature-label {

            margin-bottom: 8px;

            color:
                var(
                    --red,
                    #ff1b1b
                );

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 4px;

        }


        .torii-feature h2 {

            margin: 0 0 12px;

            font-size: clamp(
                30px,
                4vw,
                52px
            );

            line-height: 1;

            font-weight: 900;

        }


        .torii-feature h2 span {

            color:
                var(
                    --red,
                    #ff1b1b
                );

        }


        .torii-feature p {

            margin: 0;

            color: #ccc;

            font-size: 14px;

            line-height: 1.6;

        }


        /* =====================================================
           TABLET
        ====================================================== */

        @media (max-width: 1400px) {

            .torii-products-grid {

                grid-template-columns:
                    repeat(
                        4,
                        minmax(0, 1fr)
                    );

            }

        }


        @media (max-width: 1050px) {

            .torii-products-grid {

                grid-template-columns:
                    repeat(
                        3,
                        minmax(0, 1fr)
                    );

                column-gap: 18px;

                row-gap: 55px;

            }


            .torii-intro {

                padding-top: 90px;

            }

        }


        /* =====================================================
           MÓVIL
        ====================================================== */

        @media (max-width: 700px) {

            .torii-page {

                width:
                    calc(
                        100% - 30px
                    );

            }


            .torii-intro {

                padding-top: 95px;

                padding-bottom: 50px;

            }


            .torii-intro h1 {

                font-size: 48px;

                letter-spacing: -2px;

            }


            .torii-intro p {

                font-size: 13px;

            }


            .torii-category-bar {

                margin-bottom: 30px;

            }


            .torii-products-grid {

                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );

                column-gap: 14px;

                row-gap: 45px;

            }


            .torii-product-info {

                padding-top: 11px;

            }


            .torii-product-category {

                font-size: 8px;

            }


            .torii-product-name {

                font-size: 12px;

            }


            .torii-product-price {

                font-size: 12px;

                margin-top: 5px;

            }


            .torii-feature {

                margin-top: 80px;

                margin-bottom: 60px;

                min-height: 220px;

                padding: 30px 25px;

                border-radius: 8px;

            }


            .torii-feature::before {

                width: 90px;

            }


            .torii-feature::after {

                width: 90px;

            }


            .torii-feature h2 {

                font-size: 32px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div id="satori-header"></div>


    <main>


        <div class="torii-page">


            <!-- =================================================
                 INTRO
            ================================================== -->

            <section class="torii-intro">

                <div class="torii-intro-label">
                    SATORII · TORII
                </div>


                <h1>
                    TORII <span>MODE.</span>
                </h1>


                <p>
                    Una colección inspirada en la estética
                    japonesa, sus símbolos y su arquitectura.
                </p>

            </section>


            <!-- =================================================
                 CATEGORÍA
            ================================================== -->

            <div class="torii-category-bar">

                <h2 class="torii-category-title">
                    COLECCIÓN TORII
                </h2>


                <span
                    class="torii-product-count"
                    id="torii-product-count"
                >
                    0 productos
                </span>

            </div>


            <!-- =================================================
                 PRODUCTOS
            ================================================== -->

            <section
                class="torii-products-grid"
                id="torii-products-grid"
            >
            </section>


            <!-- =================================================
                 PACK FINAL
            ================================================== -->

            <section class="torii-feature">

                <div class="torii-feature-content">

                    <div class="torii-feature-label">
                        SATORII
                    </div>


                    <h2>
                        LLEVA TU
                        <span>TORII.</span>
                    </h2>


                    <p>
                        Descubre prendas SATORII inspiradas en
                    la estética y esencia de Japón.
                    </p>

                </div>

            </section>


        </div>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div id="satori-footer"></div>


    <!-- =====================================================
         SCRIPTS
    ====================================================== -->

    <script src="js/products.js"></script>

    <script src="js/header.js"></script>

    <script src="js/footer.js"></script>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                const grid =
                    document.getElementById(
                        "torii-products-grid"
                    );


                const count =
                    document.getElementById(
                        "torii-product-count"
                    );


                if (!grid) {

                    return;

                }


                /* ==========================================
                   COMPROBAR CATÁLOGO
                ========================================== */

                if (
                    typeof PRODUCTS === "undefined" ||
                    !Array.isArray(PRODUCTS)
                ) {

                    grid.innerHTML = `

                        <div class="torii-empty">

                            <strong>
                                No se pudo cargar el catálogo.
                            </strong>

                            Revisa que
                            js/products.js
                            esté disponible.

                        </div>

                    `;

                    return;

                }


                /* ==========================================
                   FILTRAR anime
                ========================================== */

                const toriiProducts =
                    PRODUCTS.filter(
                        function (product) {

                            return String(
                                product.category || ""
                            )
                            .toLowerCase()
                            .trim() === "torii";

                        }
                    );


                /* ==========================================
                   CONTADOR
                ========================================== */

                count.textContent =
                    `${toriiProducts.length} ${
                        toriiProducts.length === 1
                            ? "producto"
                            : "productos"
                    }`;


                /* ==========================================
                   SIN PRODUCTOS
                ========================================== */

                if (
                    toriiProducts.length === 0
                ) {

                    grid.innerHTML = `

                        <div class="torii-empty">

                            <strong>
                                Próximamente
                            </strong>

                            Estamos preparando
                            nuevos diseños de la colección Torii.

                        </div>

                    `;

                    return;

                }


                /* ==========================================
                   CREAR PRODUCTOS
                ========================================== */

                toriiProducts.forEach(
                    function (product) {


                        /* ----------------------------------
                           IMÁGENES
                        ---------------------------------- */

                        const primaryImage =
                            product.images?.[0] ||
                            product.image ||
                            "";


                        const secondaryImage =
                            product.images?.[1] ||
                            primaryImage;


                        /* ----------------------------------
                           URL AUTOMÁTICA
                        ---------------------------------- */

                        const productId =
                            String(
                                product.id ||
                                product.name ||
                                ""
                            )
                            .normalize("NFD")
                            .replace(
                                /[\u0300-\u036f]/g,
                                ""
                            )
                            .toLowerCase()
                            .trim()
                            .replace(
                                /[^a-z0-9]+/g,
                                "-"
                            )
                            .replace(
                                /^-+|-+$/g,
                                ""
                            );


                        const productCategory =
                            String(
                                product.category ||
                                "otros"
                            )
                            .normalize("NFD")
                            .replace(
                                /[\u0300-\u036f]/g,
                                ""
                            )
                            .toLowerCase()
                            .trim();


                        const productUrl =
                            "productos/" +
                            productCategory +
                            "/" +
                            productId +
                            ".html";


                        /* ----------------------------------
                           PRECIO
                        ---------------------------------- */

                        let price = "";


                        if (
                            product.price !== undefined &&
                            product.price !== null
                        ) {

                            price =
                                new Intl.NumberFormat(
                                    "es-CL",
                                    {
                                        style:
                                            "currency",

                                        currency:
                                            "CLP",

                                        maximumFractionDigits:
                                            0
                                    }
                                )
                                .format(
                                    Number(
                                        product.price
                                    )
                                );

                        }


                        /* ----------------------------------
                           TARJETA
                        ---------------------------------- */

                        const card =
                            document.createElement(
                                "a"
                            );


                        card.className =
                            "torii-product";


                        card.href =
                            productUrl;


                        card.innerHTML = `

                            <div
                                class="
                                    torii-product-image
                                "
                            >

                                <img
                                    class="image-primary"
                                    src="${primaryImage}"
                                    alt="${
                                        product.name ||
                                        "Producto SATORII"
                                    }"
                                    loading="lazy"
                                >


                                <img
                                    class="image-secondary"
                                    src="${secondaryImage}"
                                    alt="${
                                        product.name ||
                                        "Producto SATORII"
                                    }"
                                    loading="lazy"
                                >

                            </div>


                            <div
                                class="
                                    torii-product-info
                                "
                            >

                                <div
                                    class="
                                        torii-product-category
                                    "
                                >
                                    TORII
                                </div>


                                <h3
                                    class="
                                        torii-product-name
                                    "
                                >
                                    ${
                                        product.name ||
                                        "Producto"
                                    }
                                </h3>


                                <div
                                    class="
                                        torii-product-price
                                    "
                                >
                                    ${price}
                                </div>

                            </div>

                        `;


                        grid.appendChild(
                            card
                        );

                    }
                );

            }
        );

    </script>


</body>

</html>
