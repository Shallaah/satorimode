<script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            "use strict";


            /* =================================================
               ELEMENTOS
            ================================================= */

            const grid =
                document.getElementById(
                    "goods-products-grid"
                );


            const count =
                document.getElementById(
                    "anime-goods-product-count"
                );


            const filterButtons =
                document.querySelectorAll(
                    ".goods-filter"
                );


            if (!grid) {

                return;

            }


            /* =================================================
               COMPROBAR PRODUCTS.JS
            ================================================= */

            if (
                typeof PRODUCTS === "undefined" ||
                !Array.isArray(PRODUCTS)
            ) {

                grid.innerHTML = `

                    <div class="goods-empty">

                        <strong>
                            No se pudo cargar el catálogo.
                        </strong>

                        Revisa que
                        js/products.js
                        esté disponible.

                    </div>

                `;

                return;

            }


            /* =================================================
               OBTENER ANIME GOODS
            ================================================= */

            const goodsProducts =
                PRODUCTS.filter(
                    function (product) {

                        if (
                            product.available !== true
                        ) {

                            return false;

                        }


                        const category =
                            String(
                                product.category || ""
                            )
                            .toLowerCase()
                            .trim();


                        return (
                            category === "anime-goods" ||
                            category === "anime goods"
                        );

                    }
                );


            /* =================================================
               OBTENER TIPO
            ================================================= */

            function getType(product) {

                return String(
                    product.type ||
                    product.productType ||
                    product.subcategory ||
                    ""
                )
                .toLowerCase()
                .trim();

            }


            /* =================================================
               ESCAPAR HTML
            ================================================= */

            function escapeHTML(value) {

                return String(
                    value ?? ""
                )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

            }


            /* =================================================
               NORMALIZAR URL DEL PRODUCTO
            ================================================= */

            function getProductUrl(product) {

                /*
                 * Si existe una URL definida
                 * en products.js, usamos esa.
                 */

                if (
                    product &&
                    product.url
                ) {

                    let url =
                        String(
                            product.url
                        )
                        .trim();


                    /*
                     * Eliminamos "/" iniciales
                     * para evitar rutas incorrectas.
                     */

                    url =
                        url.replace(
                            /^\/+/,
                            ""
                        );


                    /*
                     * Si alguien puso:
                     *
                     * /satorimode/productos/...
                     *
                     * o
                     *
                     * satorimode/productos/...
                     *
                     * evitamos duplicarlo.
                     */

                    if (
                        url.startsWith(
                            "satorimode/"
                        )
                    ) {

                        return "/" + url;

                    }


                    /*
                     * Ruta normal dentro del proyecto.
                     */

                    return (
                        "/satorimode/" +
                        url
                    );

                }


                /* =================================================
                   FALLBACK
                ================================================== */

                const productId =
                    String(
                        product.id ||
                        product.name ||
                        ""
                    )
                    .normalize("NFD")
                    .replace(
                        /[\u0300-\u036f]/g,
                        ""
                    )
                    .toLowerCase()
                    .trim()
                    .replace(
                        /[^a-z0-9]+/g,
                        "-"
                    )
                    .replace(
                        /^-+|-+$/g,
                        ""
                    );


                return (
                    "/satorimode/" +
                    "productos/" +
                    "anime-goods/" +
                    productId +
                    ".html"
                );

            }


            /* =================================================
               PRECIO
            ================================================= */

            function formatPrice(value) {

                return new Intl.NumberFormat(
                    "es-CL",
                    {
                        style:
                            "currency",

                        currency:
                            "CLP",

                        maximumFractionDigits:
                            0
                    }
                )
                .format(
                    Number(value) || 0
                );

            }


            /* =================================================
               RENDER
            ================================================= */

            function renderProducts(
                filter = "all"
            ) {

                grid.innerHTML =
                    "";


                const filtered =
                    goodsProducts.filter(
                        function (product) {

                            if (
                                filter ===
                                "all"
                            ) {

                                return true;

                            }


                            return (
                                getType(
                                    product
                                ) ===
                                filter
                            );

                        }
                    );


                /* =================================================
                   CONTADOR
                ================================================= */

                count.textContent =
                    `${filtered.length} ${
                        filtered.length === 1
                            ? "producto"
                            : "productos"
                    }`;


                /* =================================================
                   SIN PRODUCTOS
                ================================================= */

                if (
                    filtered.length === 0
                ) {

                    grid.innerHTML = `

                        <div class="goods-empty">

                            <strong>
                                Próximamente
                            </strong>

                            Estamos preparando
                            nuevos Anime Goods.

                        </div>

                    `;

                    return;

                }


                /* =================================================
                   CREAR TARJETAS
                ================================================= */

                filtered.forEach(
                    function (product) {


                        /* -----------------------------------------
                           IMÁGENES
                        ------------------------------------------ */

                        const primaryImage =
                            product.images?.[0] ||
                            product.image ||
                            "";


                        const secondaryImage =
                            product.images?.[1] ||
                            primaryImage;


                        /* -----------------------------------------
                           URL
                        ------------------------------------------ */

                        const productUrl =
                            getProductUrl(
                                product
                            );


                        /* -----------------------------------------
                           TIPO
                        ------------------------------------------ */

                        const type =
                            getType(
                                product
                            );


                        const typeLabels = {

                            peluche:
                                "PELUCHE",

                            figura:
                                "FIGURA",

                            llavero:
                                "LLAVERO",

                            coleccionable:
                                "COLECCIONABLE"

                        };


                        const typeLabel =
                            typeLabels[type] ||
                            "ANIME GOODS";


                        /* -----------------------------------------
                           BADGES
                        ------------------------------------------ */

                        const badges = [];


                        /*
                         * NUEVO
                         */

                        if (
                            typeof isProductNew ===
                            "function" &&
                            isProductNew(
                                product
                            )
                        ) {

                            badges.push(`

                                <span
                                    class="
                                        goods-product-badge
                                        new
                                    "
                                >
                                    NUEVO
                                </span>

                            `);

                        }


                        /*
                         * DESTACADO
                         */

                        if (
                            product.featured ===
                            true
                        ) {

                            badges.push(`

                                <span
                                    class="
                                        goods-product-badge
                                        featured
                                    "
                                >
                                    DESTACADO
                                </span>

                            `);

                        }


                        /* -----------------------------------------
                           TARJETA
                        ------------------------------------------ */

                        const card =
                            document.createElement(
                                "a"
                            );


                        card.className =
                            "goods-product";


                        /*
                         * AQUÍ ESTÁ LA PARTE IMPORTANTE:
                         *
                         * La tarjeta ahora apunta siempre
                         * a una ruta válida dentro de SATORII.
                         */

                        card.href =
                            productUrl;


                        card.setAttribute(
                            "aria-label",
                            `Ver ${product.name || "producto"}`
                        );


                        /* -----------------------------------------
                           HTML
                        ------------------------------------------ */

                        card.innerHTML = `

                            <div
                                class="
                                    goods-product-image
                                "
                            >

                                ${
                                    badges.length
                                        ? `

                                            <div
                                                class="
                                                    goods-product-badges
                                                "
                                            >

                                                ${badges.join("")}

                                            </div>

                                        `
                                        : ""
                                }


                                ${
                                    primaryImage
                                        ? `

                                            <img
                                                class="
                                                    image-primary
                                                "
                                                src="${escapeHTML(
                                                    primaryImage
                                                )}"
                                                alt="${escapeHTML(
                                                    product.name ||
                                                    "Anime Goods SATORII"
                                                )}"
                                                loading="lazy"
                                            >

                                        `
                                        : ""
                                }


                                ${
                                    secondaryImage
                                        ? `

                                            <img
                                                class="
                                                    image-secondary
                                                "
                                                src="${escapeHTML(
                                                    secondaryImage
                                                )}"
                                                alt="${escapeHTML(
                                                    product.name ||
                                                    "Anime Goods SATORII"
                                                )}"
                                                loading="lazy"
                                            >

                                        `
                                        : ""
                                }

                            </div>


                            <div
                                class="
                                    goods-product-info
                                "
                            >

                                <div
                                    class="
                                        goods-product-category
                                    "
                                >
                                    ${escapeHTML(
                                        typeLabel
                                    )}
                                </div>


                                <h3
                                    class="
                                        goods-product-name
                                    "
                                >
                                    ${escapeHTML(
                                        product.name ||
                                        "Producto"
                                    )}
                                </h3>


                                <div
                                    class="
                                        goods-product-price
                                    "
                                >
                                    ${formatPrice(
                                        product.price
                                    )}
                                </div>

                            </div>

                        `;


                        grid.appendChild(
                            card
                        );

                    }
                );

            }


            /* =================================================
               FILTROS
            ================================================== */

            filterButtons.forEach(
                function (button) {

                    button.addEventListener(
                        "click",
                        function () {

                            filterButtons
                                .forEach(
                                    function (item) {

                                        item.classList.remove(
                                            "active"
                                        );

                                    }
                                );


                            button.classList.add(
                                "active"
                            );


                            renderProducts(
                                button.dataset.goodsFilter
                            );

                        }
                    );

                }
            );


            /* =================================================
               INICIAR
            ================================================= */

            renderProducts(
                "all"
            );

        }
    );

</script>
