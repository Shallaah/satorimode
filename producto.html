<div class="product-option">

    <div class="product-option-title">
        TALLA
    </div>

    <div class="size-options">

        <label class="size-choice">

            <input
                type="radio"
                name="size"
                value="M"
                checked
            >

            <span>
                M
            </span>

        </label>


        <label class="size-choice">

            <input
                type="radio"
                name="size"
                value="L"
            >

            <span>
                L
            </span>

        </label>


        <label class="size-choice">

            <input
                type="radio"
                name="size"
                value="XL"
            >

            <span>
                XL
            </span>

        </label>

    </div>

</div>
