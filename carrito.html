<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="icon" type="image/png" href="img/logo.png">
    
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="SatoriMode — Tu carrito de compras."
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>Carrito | Satorii</title>


    <!-- =====================================================
         ESTILOS GLOBALES
    ====================================================== -->

    <link
        rel="stylesheet"
        href="/satorimode/css/style.css"
    >


    <style>

        /* =====================================================
           PÁGINA
        ====================================================== */

        .satori-cart-page {

            width:100%;

            min-height:70vh;

            padding:
                90px
                30px
                80px;

            background:#fff;

        }


        .satori-cart-container {

            width:min(
                1200px,
                100%
            );

            margin:0 auto;

        }


        /* =====================================================
           CABECERA
        ====================================================== */

        .satori-cart-heading {

            margin-bottom:55px;

        }


        .satori-cart-label {

            display:block;

            margin-bottom:12px;

            color:#f31218;

            font-size:10px;

            font-weight:800;

            letter-spacing:3px;

        }


        .satori-cart-heading h1 {

            margin:0;

            color:#111;

            font-size:
                clamp(
                    44px,
                    7vw,
                    82px
                );

            line-height:.9;

            font-weight:900;

            letter-spacing:-4px;

        }


        .satori-cart-heading p {

            max-width:650px;

            margin:
                22px 0
                0;

            color:#777;

            font-size:14px;

            line-height:1.7;

        }


        /* =====================================================
           LAYOUT
        ====================================================== */

        .satori-cart-layout {

            display:grid;

            grid-template-columns:
                minmax(0,1fr)
                350px;

            gap:60px;

            align-items:start;

        }


        /* =====================================================
           LISTA
        ====================================================== */

        .satori-cart-products {

            width:100%;

            border-top:
                1px solid #ddd;

        }


        /* =====================================================
           PRODUCTO
        ====================================================== */

        .satori-cart-item {

            display:grid;

            grid-template-columns:
                130px
                minmax(0,1fr)
                auto;

            gap:22px;

            padding:
                24px 0;

            border-bottom:
                1px solid #e5e5e5;

        }


        /* =====================================================
           IMAGEN
        ====================================================== */

        .satori-cart-image {

            width:130px;

            aspect-ratio:1 / 1;

            height:auto;

            overflow:hidden;

            background:#f5f5f5;

            border-radius:6px;

        }


        .satori-cart-image img {

            width:100%;

            height:100%;

            display:block;

            object-fit:cover;

            object-position:center;

        }


        /* =====================================================
           INFORMACIÓN
        ====================================================== */

        .satori-cart-info {

            min-width:0;

            padding-top:3px;

        }


        .satori-cart-category {

            display:block;

            margin-bottom:7px;

            color:#f31218;

            font-size:9px;

            font-weight:800;

            letter-spacing:2px;

        }


        .satori-cart-name {

            margin:0;

            color:#111;

            font-size:19px;

            font-weight:800;

            line-height:1.25;

        }


        .satori-cart-options {

            margin-top:9px;

            color:#777;

            font-size:12px;

            line-height:1.6;

        }


        /* =====================================================
           PRECIO MÓVIL
        ====================================================== */

        .satori-cart-price-mobile {

            display:none;

            margin-top:8px;

            color:#111;

            font-size:14px;

            font-weight:900;

        }


        /* =====================================================
           CONTROLES
        ====================================================== */

        .satori-cart-controls {

            display:flex;

            align-items:center;

            gap:16px;

            margin-top:20px;

        }


        .satori-cart-quantity {

            display:flex;

            align-items:center;

            height:38px;

            border:
                1px solid #ccc;

            border-radius:5px;

            overflow:hidden;

        }


        .satori-cart-quantity button {

            width:38px;

            height:100%;

            padding:0;

            border:0;

            background:#fff;

            color:#111;

            font-size:18px;

            cursor:pointer;

        }


        .satori-cart-quantity button:hover {

            background:#f4f4f4;

        }


        .satori-cart-quantity span {

            min-width:38px;

            text-align:center;

            color:#111;

            font-size:12px;

            font-weight:700;

        }


        .satori-cart-remove {

            padding:0;

            border:0;

            background:transparent;

            color:#888;

            font-size:9px;

            font-weight:800;

            letter-spacing:1px;

            cursor:pointer;

        }


        .satori-cart-remove:hover {

            color:#f31218;

        }


        /* =====================================================
           PRECIO TOTAL PRODUCTO
        ====================================================== */

        .satori-cart-item-total {

            min-width:110px;

            padding-top:3px;

            color:#111;

            font-size:16px;

            font-weight:900;

            text-align:right;

            white-space:nowrap;

        }


        /* =====================================================
           RESUMEN
        ====================================================== */

        .satori-cart-summary {

            position:sticky;

            top:90px;

            padding:28px;

            background:#f8f8f8;

            border:
                1px solid #ddd;

            border-radius:7px;

        }


        .satori-cart-summary-label {

            display:block;

            margin-bottom:18px;

            color:#f31218;

            font-size:9px;

            font-weight:800;

            letter-spacing:2px;

        }


        .satori-cart-summary h2 {

            margin:
                0 0 25px;

            color:#111;

            font-size:24px;

            font-weight:900;

            letter-spacing:-1px;

        }


        .satori-cart-summary-row {

            display:flex;

            align-items:center;

            justify-content:space-between;

            gap:20px;

            padding:
                14px 0;

            border-top:
                1px solid #ddd;

        }


        .satori-cart-summary-row span {

            color:#555;

            font-size:11px;

            font-weight:700;

            letter-spacing:1px;

        }


        .satori-cart-summary-row strong {

            color:#111;

            font-size:17px;

            font-weight:900;

        }


        .satori-cart-shipping {

            margin:
                8px 0 22px;

            color:#888;

            font-size:10px;

            line-height:1.6;

        }


        .satori-cart-checkout {

            width:100%;

            min-height:50px;

            border:0;

            border-radius:5px;

            background:#f31218;

            color:#fff;

            font-size:10px;

            font-weight:900;

            letter-spacing:1px;

            cursor:pointer;

        }


        .satori-cart-checkout:hover {

            background:#111;

        }


        .satori-cart-continue {

            display:block;

            margin-top:16px;

            color:#555;

            text-align:center;

            text-decoration:none;

            font-size:10px;

            font-weight:800;

        }


        .satori-cart-continue:hover {

            color:#f31218;

        }


        .satori-cart-clear {

            width:100%;

            margin-top:25px;

            padding:
                13px 0;

            border:0;

            border-top:
                1px solid #ddd;

            background:transparent;

            color:#888;

            font-size:9px;

            font-weight:800;

            letter-spacing:1px;

            cursor:pointer;

        }


        .satori-cart-clear:hover {

            color:#f31218;

        }


        /* =====================================================
           CARRITO VACÍO
        ====================================================== */

        .satori-cart-empty {

            min-height:500px;

            display:flex;

            flex-direction:column;

            align-items:center;

            justify-content:center;

            padding:
                60px 20px;

            text-align:center;

            border-top:
                1px solid #ddd;

        }


        .satori-cart-empty-label {

            margin-bottom:12px;

            color:#f31218;

            font-size:10px;

            font-weight:800;

            letter-spacing:3px;

        }


        .satori-cart-empty h2 {

            margin:0;

            color:#111;

            font-size:
                clamp(
                    30px,
                    5vw,
                    50px
                );

            font-weight:900;

            letter-spacing:-2px;

        }


        .satori-cart-empty p {

            max-width:480px;

            margin:
                18px auto 28px;

            color:#777;

            font-size:13px;

            line-height:1.7;

        }


        .satori-cart-empty-button {

            min-height:48px;

            display:inline-flex;

            align-items:center;

            justify-content:center;

            padding:
                0 28px;

            border-radius:4px;

            background:#111;

            color:#fff;

            text-decoration:none;

            font-size:10px;

            font-weight:900;

            letter-spacing:1px;

        }


        .satori-cart-empty-button:hover {

            background:#f31218;

        }


        /* =====================================================
           TABLET
        ====================================================== */

        @media (
            max-width:900px
        ) {

            .satori-cart-page {

                padding:
                    65px
                    20px
                    70px;

            }


            .satori-cart-layout {

                grid-template-columns:1fr;

                gap:45px;

            }


            .satori-cart-summary {

                position:static;

            }

        }


        /* =====================================================
           MÓVIL
        ====================================================== */

        @media (
            max-width:650px
        ) {

            .satori-cart-heading {

                margin-bottom:40px;

            }


            .satori-cart-heading h1 {

                font-size:52px;

                letter-spacing:-2px;

            }


            .satori-cart-heading p {

                font-size:13px;

            }


            .satori-cart-item {

                grid-template-columns:
                    100px
                    minmax(0,1fr);

                gap:15px;

            }


            .satori-cart-image {

                width:100px;

                aspect-ratio:1 / 1;

                height:auto;

            }


            .satori-cart-item-total {

                display:none;

            }


            .satori-cart-price-mobile {

                display:block;

            }


            .satori-cart-name {

                font-size:16px;

            }


            .satori-cart-controls {

                flex-wrap:wrap;

                gap:10px;

                margin-top:14px;

            }


            .satori-cart-summary {

                padding:22px;

            }


            .satori-cart-empty {

                min-height:420px;

            }

        }


        /* =====================================================
           MÓVIL PEQUEÑO
        ====================================================== */

        @media (
            max-width:380px
        ) {

            .satori-cart-item {

                grid-template-columns:
                    85px
                    minmax(0,1fr);

            }


            .satori-cart-image {

                width:85px;

            }

        }


        /* =====================================================
           REDUCCIÓN DE MOVIMIENTO
        ====================================================== */

        @media (
            prefers-reduced-motion:reduce
        ) {

            .satori-cart-quantity button,
            .satori-cart-remove,
            .satori-cart-checkout,
            .satori-cart-continue,
            .satori-cart-clear {

                transition:none;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER GLOBAL
    ====================================================== -->

    <div id="satori-header"></div>


    <!-- =====================================================
         CONTENIDO
    ====================================================== -->

    <main class="satori-cart-page">

        <div class="satori-cart-container">


            <!-- =================================================
                 CABECERA
            ================================================== -->

            <header class="satori-cart-heading">

                <span class="satori-cart-label">
                    SATORII · SHOPPING CART
                </span>


                <h1>
                    TU CARRITO.
                </h1>


                <p>
                    Revisa tus productos antes de continuar.
                    Puedes modificar cantidades o eliminar
                    artículos cuando quieras.
                </p>

            </header>


            <!-- =================================================
                 CONTENIDO DINÁMICO
            ================================================== -->

            <div
                id="satori-cart-page-content"
            ></div>

        </div>

    </main>


    <!-- =====================================================
         FOOTER GLOBAL
         
         IMPORTANTE:
         El contenido real del footer lo genera footer.js.
    ====================================================== -->

    <div id="satori-footer"></div>


    <!-- =====================================================
         SCRIPTS GLOBALES
    ====================================================== -->

    <script
        src="/satorimode/js/header.js"
    ></script>


    <script
        src="/satorimode/js/footer.js"
    ></script>


    <script
        src="/satorimode/js/cart.js"
    ></script>


    <!-- =====================================================
         RENDER CARRITO
    ====================================================== -->

    <script>

        "use strict";


        /* =====================================================
           CLAVE DEL CARRITO
        ====================================================== */

        const CART_KEY =
            "satorimode_cart";


        const cartContent =
            document.getElementById(
                "satori-cart-page-content"
            );


        /* =====================================================
           LEER CARRITO
        ====================================================== */

        function getPageCart() {

            try {

                const saved =
                    localStorage.getItem(
                        CART_KEY
                    );


                if (!saved) {

                    return [];

                }


                const cart =
                    JSON.parse(saved);


                return Array.isArray(cart)
                    ? cart
                    : [];

            }

            catch (error) {

                console.error(
                    "SatoriMode · Error leyendo carrito:",
                    error
                );

                return [];

            }

        }


        /* =====================================================
           FORMATO PRECIO
        ====================================================== */

        function formatPagePrice(
            price
        ) {

            return new Intl.NumberFormat(
                "es-CL",
                {
                    style:"currency",
                    currency:"CLP",
                    maximumFractionDigits:0
                }
            ).format(
                Number(price) || 0
            );

        }


        /* =====================================================
           ESCAPE HTML
        ====================================================== */

        function escapeHTML(
            value
        ) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================================
           GUARDAR CARRITO
        ====================================================== */

        function savePageCart(
            cart
        ) {

            try {

                localStorage.setItem(
                    CART_KEY,
                    JSON.stringify(
                        cart
                    )
                );


                document.dispatchEvent(
                    new CustomEvent(
                        "satorii:cart-updated"
                    )
                );

            }

            catch (error) {

                console.error(
                    "SatoriMode · Error guardando carrito:",
                    error
                );

            }

        }


        /* =====================================================
           RENDER
        ====================================================== */

        function renderPageCart() {

            if (!cartContent) {

                return;

            }


            const cart =
                getPageCart();


            /* =================================================
               VACÍO
            ================================================== */

            if (
                cart.length === 0
            ) {

                cartContent.innerHTML = `

                    <section
                        class="satori-cart-empty"
                    >

                        <span
                            class="satori-cart-empty-label"
                        >
                            SATORII · CARRITO
                        </span>


                        <h2>
                            TU CARRITO ESTÁ VACÍO.
                        </h2>


                        <p>
                            Aún no tienes productos
                            en tu carrito.
                            Explora nuestras colecciones
                            y encuentra algo que sea parte
                            de tu estilo.
                        </p>


                        <a
                            href="/satorimode/productos.html"
                            class="satori-cart-empty-button"
                        >
                            EXPLORAR PRODUCTOS
                        </a>

                    </section>

                `;

                return;

            }


            let subtotal =
                0;

            let totalItems =
                0;


            /* =================================================
               CALCULAR TOTALES
            ================================================== */

            cart.forEach(
                function (
                    product
                ) {

                    const quantity =
                        Math.max(
                            1,
                            Number(
                                product.quantity || 1
                            )
                        );


                    const price =
                        Number(
                            product.price || 0
                        );


                    subtotal +=
                        price *
                        quantity;


                    totalItems +=
                        quantity;

                }
            );


            /* =================================================
               PRODUCTOS
            ================================================== */

            let productsHTML =
                "";


            cart.forEach(
                function (
                    product,
                    index
                ) {

                    const quantity =
                        Math.max(
                            1,
                            Number(
                                product.quantity || 1
                            )
                        );


                    const price =
                        Number(
                            product.price || 0
                        );


                    const itemTotal =
                        price *
                        quantity;


                    let options =
                        "";


                    if (
                        product.size
                    ) {

                        options +=
                            "Talla: " +
                            escapeHTML(
                                product.size
                            );

                    }


                    if (
                        product.color
                    ) {

                        if (
                            options
                        ) {

                            options +=
                                " · ";

                        }


                        options +=
                            "Color: " +
                            escapeHTML(
                                product.color
                            );

                    }


                    productsHTML += `

                        <article
                            class="satori-cart-item"
                        >

                            <div
                                class="satori-cart-image"
                            >

                                <img
                                    src="${escapeHTML(
                                        product.image || ""
                                    )}"
                                    alt="${escapeHTML(
                                        product.name ||
                                        "Producto"
                                    )}"
                                    loading="lazy"
                                >

                            </div>


                            <div
                                class="satori-cart-info"
                            >

                                <span
                                    class="satori-cart-category"
                                >
                                    SATORII
                                </span>


                                <h2
                                    class="satori-cart-name"
                                >
                                    ${escapeHTML(
                                        product.name ||
                                        "Producto"
                                    )}
                                </h2>


                                ${
                                    options
                                        ? `
                                            <div
                                                class="satori-cart-options"
                                            >
                                                ${options}
                                            </div>
                                        `
                                        : ""
                                }


                                <div
                                    class="satori-cart-price-mobile"
                                >
                                    ${formatPagePrice(
                                        itemTotal
                                    )}
                                </div>


                                <div
                                    class="satori-cart-controls"
                                >

                                    <div
                                        class="satori-cart-quantity"
                                    >

                                        <button
                                            type="button"
                                            data-cart-decrease="${index}"
                                            aria-label="Disminuir cantidad"
                                        >
                                            −
                                        </button>


                                        <span>
                                            ${quantity}
                                        </span>


                                        <button
                                            type="button"
                                            data-cart-increase="${index}"
                                            aria-label="Aumentar cantidad"
                                        >
                                            +
                                        </button>

                                    </div>


                                    <button
                                        type="button"
                                        class="satori-cart-remove"
                                        data-cart-remove="${index}"
                                    >
                                        ELIMINAR
                                    </button>

                                </div>

                            </div>


                            <div
                                class="satori-cart-item-total"
                            >

                                ${formatPagePrice(
                                    itemTotal
                                )}

                            </div>

                        </article>

                    `;

                }
            );


            /* =================================================
               ESTRUCTURA
            ================================================== */

            cartContent.innerHTML = `

                <div
                    class="satori-cart-layout"
                >

                    <section
                        class="satori-cart-products"
                    >

                        ${productsHTML}

                    </section>


                    <aside
                        class="satori-cart-summary"
                    >

                        <span
                            class="satori-cart-summary-label"
                        >
                            SATORII · RESUMEN
                        </span>


                        <h2>
                            RESUMEN DEL PEDIDO
                        </h2>


                        <div
                            class="satori-cart-summary-row"
                        >

                            <span>
                                PRODUCTOS
                            </span>


                            <strong>
                                ${totalItems}
                            </strong>

                        </div>


                        <div
                            class="satori-cart-summary-row"
                        >

                            <span>
                                SUBTOTAL
                            </span>


                            <strong>
                                ${formatPagePrice(
                                    subtotal
                                )}
                            </strong>

                        </div>


                        <p
                            class="satori-cart-shipping"
                        >
                            El envío se calculará durante
                            el proceso de compra.
                        </p>


                        <button
                            type="button"
                            class="satori-cart-checkout"
                            id="satori-cart-checkout"
                        >
                            CONTINUAR CON LA COMPRA
                        </button>


                        <a
                            href="/satorimode/productos.html"
                            class="satori-cart-continue"
                        >
                            ← SEGUIR COMPRANDO
                        </a>


                        <button
                            type="button"
                            class="satori-cart-clear"
                            id="satori-cart-clear"
                        >
                            VACIAR CARRITO
                        </button>

                    </aside>

                </div>

            `;


            /* =================================================
               DISMINUIR
            ================================================== */

            cartContent
                .querySelectorAll(
                    "[data-cart-decrease]"
                )
                .forEach(
                    function (
                        button
                    ) {

                        button.addEventListener(
                            "click",
                            function () {

                                const index =
                                    Number(
                                        button.dataset.cartDecrease
                                    );


                                const current =
                                    getPageCart();


                                if (
                                    !current[index]
                                ) {

                                    return;

                                }


                                current[index].quantity =
                                    Number(
                                        current[index].quantity || 1
                                    ) - 1;


                                if (
                                    current[index].quantity <= 0
                                ) {

                                    current.splice(
                                        index,
                                        1
                                    );

                                }


                                savePageCart(
                                    current
                                );

                                renderPageCart();

                            }
                        );

                    }
                );


            /* =================================================
               AUMENTAR
            ================================================== */

            cartContent
                .querySelectorAll(
                    "[data-cart-increase]"
                )
                .forEach(
                    function (
                        button
                    ) {

                        button.addEventListener(
                            "click",
                            function () {

                                const index =
                                    Number(
                                        button.dataset.cartIncrease
                                    );


                                const current =
                                    getPageCart();


                                if (
                                    !current[index]
                                ) {

                                    return;

                                }


                                current[index].quantity =
                                    Number(
                                        current[index].quantity || 1
                                    ) + 1;


                                savePageCart(
                                    current
                                );

                                renderPageCart();

                            }
                        );

                    }
                );


            /* =================================================
               ELIMINAR
            ================================================== */

            cartContent
                .querySelectorAll(
                    "[data-cart-remove]"
                )
                .forEach(
                    function (
                        button
                    ) {

                        button.addEventListener(
                            "click",
                            function () {

                                const index =
                                    Number(
                                        button.dataset.cartRemove
                                    );


                                const current =
                                    getPageCart();


                                if (
                                    !current[index]
                                ) {

                                    return;

                                }


                                current.splice(
                                    index,
                                    1
                                );


                                savePageCart(
                                    current
                                );

                                renderPageCart();

                            }
                        );

                    }
                );


            /* =================================================
               VACIAR CARRITO
            ================================================== */

            document
                .getElementById(
                    "satori-cart-clear"
                )
                ?.addEventListener(
                    "click",
                    function () {

                        if (
                            !confirm(
                                "¿Seguro que quieres vaciar el carrito?"
                            )
                        ) {

                            return;

                        }


                        savePageCart(
                            []
                        );

                        renderPageCart();

                    }
                );


            /* =================================================
               CHECKOUT
            ================================================== */

            document
                .getElementById(
                    "satori-cart-checkout"
                )
                ?.addEventListener(
                    "click",
                    function () {

                        alert(
                            "El sistema de pago estará disponible próximamente."
                        );

                    }
                );

        }


        /* =====================================================
           INICIALIZACIÓN
        ====================================================== */

        if (
            document.readyState ===
            "loading"
        ) {

            document.addEventListener(
                "DOMContentLoaded",
                renderPageCart
            );

        }

        else {

            renderPageCart();

        }


        /* =====================================================
           SINCRONIZACIÓN
        ====================================================== */

        document.addEventListener(
            "satorii:cart-updated",
            function () {

                renderPageCart();

            }
        );


        window.addEventListener(
            "storage",
            function (
                event
            ) {

                if (
                    event.key ===
                    CART_KEY
                ) {

                    renderPageCart();

                }

            }
        );

    </script>

</body>

</html>
