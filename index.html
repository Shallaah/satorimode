<!DOCTYPE html>
<html lang="es">

<head>

    <!-- =====================================================
         PRELOAD
    ====================================================== -->

    <link
        rel="preload"
        as="image"
        href="img/banner-01.webp"
        media="(min-width: 769px)"
    >

    <link
        rel="preload"
        as="image"
        href="img/banner-01-mobile.webp"
        media="(max-width: 768px)"
    >


    <!-- =====================================================
         CONFIGURACIÓN
    ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Satorii — Anime Streetwear, cultura japonesa y diseños para quienes viven su propio universo."
    >

    <meta
        name="theme-color"
        content="#101727"
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <meta
        name="format-detection"
        content="telephone=no"
    >

    <title>Satorii | Anime Streetwear</title>


    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link
        rel="icon"
        type="image/png"
        href="img/logo.webp"
    >


    <!-- =====================================================
         FUENTES
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         CSS PRINCIPAL
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- =====================================================
         CSS SATORII INDEX
    ====================================================== -->

    <style>

        /* =====================================================
           VARIABLES
        ====================================================== */

        :root {

            --satori-red: #EF0930;
            --satori-red-dark: #c90727;

            --satori-black: #080808;

            --satori-dark: #101727;
            --satori-dark-2: #151d2d;

            --satori-white: #ffffff;

            --satori-gray: #737373;

            --satori-light: #f3f2ef;
            --satori-paper: #eeeae2;

            --satori-width: 1700px;

        }


        /* =====================================================
           RESET
        ====================================================== */

        .satori-index,
        .satori-index * {

            box-sizing: border-box;

        }


        .satori-index a {

            text-decoration: none;

        }


        .satori-index img {

            max-width: 100%;

        }


        /* =====================================================
           CONTENEDOR
        ====================================================== */

        .satori-container {

            width:
                min(
                    var(--satori-width),
                    calc(100% - 70px)
                );

            margin: 0 auto;

        }


        /* =====================================================
           HERO
        ====================================================== */

        .hero-slider {

            position: relative;

            width: 100%;

            overflow: hidden;

            background: #111;

            touch-action: pan-y;

            user-select: none;

            -webkit-user-select: none;

            overscroll-behavior-x: contain;

        }


        .hero-track {

            display: flex;

            width: max-content;

            will-change: transform;

            transition:
                transform .65s
                cubic-bezier(
                    .22,
                    .61,
                    .36,
                    1
                );

        }


        .hero-slide {

            position: relative;

            flex: 0 0 100%;

            width: 100%;

            min-width: 100%;

        }


        .hero-slide picture {

            display: block;

            width: 100%;

        }


        .hero-slide img {

            display: block;

            width: 100%;

            height: auto;

            max-width: 100%;

            user-select: none;

            -webkit-user-drag: none;

        }


        /* =====================================================
           HERO DOTS
        ====================================================== */

        .hero-dots {

            position: absolute;

            left: 50%;

            bottom: 22px;

            transform: translateX(-50%);

            z-index: 20;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

        }


        .hero-dot {

            width: 7px;

            height: 7px;

            padding: 0;

            border: 0;

            border-radius: 50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .55
                );

            cursor: pointer;

            transition: .25s ease;

        }


        .hero-dot.active {

            width: 26px;

            border-radius: 10px;

            background: var(--satori-red);

        }


        /* =====================================================
           TICKER
        ====================================================== */

        .satori-ticker {

            position: relative;

            width: 100%;

            height: 42px;

            overflow: hidden;

            display: flex;

            align-items: center;

            background: var(--satori-dark);

            color: #fff;

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .04
                );

            border-bottom:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .08
                );

        }


        .satori-ticker-track {

            display: flex;

            width: max-content;

            white-space: nowrap;

            animation:
                satoriTicker
                24s
                linear
                infinite;

        }


        .satori-ticker-content {

            display: flex;

            align-items: center;

            gap: 28px;

            padding-right: 28px;

            flex-shrink: 0;

        }


        .satori-ticker-item {

            display: inline-flex;

            align-items: center;

            gap: 9px;

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 1.1px;

            text-transform: uppercase;

        }


        .satori-ticker-jp {

            font-family:
                "Barlow Condensed",
                Arial,
                sans-serif;

            font-size: 16px;

            color: var(--satori-red);

        }


        .satori-ticker-symbol {

            color: var(--satori-red);

            font-size: 11px;

        }


        @keyframes satoriTicker {

            from {

                transform: translateX(0);

            }

            to {

                transform: translateX(-50%);

            }

        }


        /* =====================================================
           TITULOS
        ====================================================== */

        .satori-kicker {

            color: var(--satori-red);

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 2.5px;

            line-height: 1;

            text-transform: uppercase;

        }


        .satori-heading {

            margin: 8px 0 0;

            font-family:
                "Barlow Condensed",
                "Arial Narrow",
                Arial,
                sans-serif;

            font-size:
                clamp(
                    45px,
                    5vw,
                    76px
                );

            line-height: .82;

            font-weight: 900;

            letter-spacing: -1.5px;

            color: #101010;

        }


        .satori-heading span {

            color: var(--satori-red);

        }


        /* =====================================================
           NEW DROP
        ====================================================== */

        .satori-new-drop {

            position: relative;

            padding: 72px 0 82px;

            background: #fff;

            overflow: hidden;

        }


        .satori-new-drop-layout {

            display: grid;

            grid-template-columns:
                260px
                minmax(
                    0,
                    1fr
                );

            gap: 42px;

            align-items: stretch;

        }


        /* =====================================================
           NEW DROP INTRO
        ====================================================== */

        .satori-new-drop-intro {

            display: flex;

            flex-direction: column;

            justify-content: center;

            padding: 15px 0;

        }


        .satori-new-drop-intro h2 {

            margin: 10px 0 0;

            font-family:
                "Barlow Condensed",
                Arial,
                sans-serif;

            font-size:
                clamp(
                    55px,
                    5vw,
                    78px
                );

            line-height: .78;

            font-weight: 900;

            letter-spacing: -2px;

            color: #101010;

        }


        .satori-new-drop-intro h2::after {

            content: "";

            display: block;

            width: 48px;

            height: 3px;

            margin: 24px 0 24px;

            background: var(--satori-red);

        }


        .satori-new-drop-intro p {

            max-width: 210px;

            margin: 0;

            color: #666;

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 11px;

            line-height: 1.7;

        }


        .satori-new-drop-link {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            width: fit-content;

            margin-top: 28px;

            color: var(--satori-red);

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 9px;

            font-weight: 800;

            letter-spacing: .7px;

            text-transform: uppercase;

        }


        /* =====================================================
           PRODUCTOS
        ====================================================== */

        .satori-new-drop-products {

            display: grid;

            grid-template-columns:
                minmax(
                    0,
                    1.45fr
                )
                minmax(
                    170px,
                    .72fr
                )
                minmax(
                    170px,
                    .72fr
                );

            grid-template-rows:
                1fr
                1fr;

            gap: 12px;

            min-width: 0;

        }


        .satori-feature-product {

            position: relative;

            grid-row: 1 / 3;

            min-width: 0;

            overflow: hidden;

            background: #eeeeec;

        }


        .satori-small-product {

            position: relative;

            display: grid;

            grid-template-columns:
                1fr
                1.05fr;

            min-width: 0;

            overflow: hidden;

            background: #eeeeec;

        }


        .satori-product-visual {

            position: relative;

            overflow: hidden;

            background: #eeeeec;

        }


        .satori-feature-product
        .satori-product-visual {

            min-height: 480px;

        }


        .satori-small-product
        .satori-product-visual {

            min-height: 180px;

        }


        .satori-product-visual img {

            display: block;

            width: 100%;

            height: 100%;

            object-fit: cover;

            transition:
                transform .5s ease;

        }


        .satori-feature-product:hover
        .satori-product-visual img,

        .satori-small-product:hover
        .satori-product-visual img {

            transform: scale(1.035);

        }


        .satori-product-content {

            position: absolute;

            left: 24px;

            right: 24px;

            bottom: 22px;

            z-index: 4;

        }


        .satori-small-product
        .satori-product-content {

            position: relative;

            left: auto;

            right: auto;

            bottom: auto;

            display: flex;

            flex-direction: column;

            justify-content: center;

            padding: 16px;

            background: #f1f1ef;

        }


        .satori-product-number {

            display: block;

            margin-bottom: 5px;

            color: var(--satori-red);

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 12px;

            font-weight: 800;

        }


        .satori-product-name {

            margin: 0;

            font-family:
                "Barlow Condensed",
                Arial,
                sans-serif;

            font-size: 23px;

            line-height: .9;

            font-weight: 800;

            color: #111;

        }


        .satori-feature-product
        .satori-product-content
        .satori-product-name {

            font-size: 45px;

            color: #111;

        }


        .satori-product-category {

            margin-top: 5px;

            color: #777;

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 7px;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: .5px;

        }


        .satori-product-price {

            margin-top: 7px;

            color: #111;

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 10px;

            font-weight: 800;

        }


        .satori-product-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            width: fit-content;

            margin-top: 13px;

            padding: 9px 14px;

            border: 1px solid #111;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .88
                );

            color: #111;

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 7px;

            font-weight: 800;

            letter-spacing: .4px;

            text-transform: uppercase;

            transition: .2s ease;

        }


        .satori-product-tag {

            position: absolute;

            top: 12px;

            left: 12px;

            z-index: 8;

            padding: 5px 8px;

            background: var(--satori-red);

            color: #fff;

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 7px;

            font-weight: 800;

        }


        /* =====================================================
           FALLBACK PRODUCTOS
        ====================================================== */

        .satori-product-fallback {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #171717,
                    #252525
                );

        }


        .satori-product-fallback::before {

            content: "";

            position: absolute;

            width: 70%;

            aspect-ratio: 1;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .09
                );

            transform: rotate(45deg);

        }


        .satori-product-fallback::after {

            content: "";

            position: absolute;

            width: 45%;

            aspect-ratio: 1;

            border:
                16px solid
                var(--satori-red);

            opacity: .12;

            transform: rotate(45deg);

        }


        .satori-product-fallback span {

            position: relative;

            z-index: 2;

            font-family:
                "Barlow Condensed",
                Arial,
                sans-serif;

            font-size:
                clamp(
                    40px,
                    5vw,
                    75px
                );

            font-weight: 900;

            letter-spacing: -3px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    .14
                );

        }


        /* =====================================================
           UNIVERSO
        ====================================================== */

        .satori-universe {

            position: relative;

            padding: 82px 0 88px;

            overflow: hidden;

            background: var(--satori-dark);

            color: #fff;

        }


        .satori-universe::before {

            content: "SATORII";

            position: absolute;

            left: -30px;

            top: 25px;

            font-family:
                "Barlow Condensed",
                Arial,
                sans-serif;

            font-size: 190px;

            line-height: .7;

            font-weight: 900;

            letter-spacing: -8px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    .025
                );

            pointer-events: none;

        }


        .satori-universe-layout {

            position: relative;

            z-index: 2;

            display: grid;

            grid-template-columns:
                245px
                minmax(
                    0,
                    1fr
                );

            gap: 38px;

            align-items: center;

        }


        .satori-universe-intro {

            align-self: center;

        }


        .satori-universe-intro .satori-kicker {

            color: var(--satori-red);

        }


        .satori-universe-intro h2 {

            margin: 10px 0 0;

            font-family:
                "Barlow Condensed",
                Arial,
                sans-serif;

            font-size:
                clamp(
                    50px,
                    5vw,
                    74px
                );

            line-height: .76;

            font-weight: 900;

            letter-spacing: -2px;

            text-transform: uppercase;

        }


        .satori-universe-intro h2 span {

            color: var(--satori-red);

        }


        .satori-universe-intro p {

            max-width: 210px;

            margin: 20px 0 0;

            color: #aeb4be;

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 10px;

            line-height: 1.7;

        }


        .satori-universe-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            margin-top: 24px;

            padding: 12px 16px;

            background: var(--satori-red);

            color: #fff;

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 7px;

            font-weight: 800;

            text-transform: uppercase;

        }


        /* =====================================================
           TARJETAS UNIVERSO
        ====================================================== */

        .satori-universe-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    4,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap: 12px;

        }


        .satori-universe-card {

            position: relative;

            display: block;

            min-width: 0;

            overflow: hidden;

            aspect-ratio: .72 / 1;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .35
                );

            background: #171717;

            color: #fff;

        }


        .satori-universe-card::after {

            content: "";

            position: absolute;

            inset: 0;

            z-index: 2;

            background:
                linear-gradient(
                    to top,
                    rgba(
                        0,
                        0,
                        0,
                        .88
                    ),
                    rgba(
                        0,
                        0,
                        0,
                        .05
                    ) 62%
                );

            pointer-events: none;

        }


        .satori-universe-card img {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            object-fit: cover;

            transition:
                transform .6s ease;

        }


        .satori-universe-card:hover img {

            transform: scale(1.055);

        }


        .satori-universe-card-content {

            position: absolute;

            left: 18px;

            right: 18px;

            bottom: 17px;

            z-index: 4;

        }


        .satori-universe-card h3 {

            margin: 0;

            font-family:
                "Barlow Condensed",
                Arial,
                sans-serif;

            font-size: 30px;

            line-height: .82;

            font-weight: 900;

        }


        .satori-universe-card small {

            display: block;

            margin-top: 6px;

            color: #b8bdc5;

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 7px;

            text-transform: uppercase;

        }


        .satori-universe-arrow {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 30px;

            height: 30px;

            margin-top: 13px;

            border:
                1px solid
                var(--satori-red);

            border-radius: 50%;

            color: #fff;

            font-size: 13px;

        }


        .satori-universe-fallback {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    #131313,
                    #292929
                );

        }


        .satori-universe-fallback span {

            font-family:
                "Barlow Condensed",
                Arial,
                sans-serif;

            font-size: 55px;

            font-weight: 900;

            color:
                rgba(
                    255,
                    255,
                    255,
                    .12
                );

        }


        /* =====================================================
           FRANJA DE IDENTIDAD SATORII
        ====================================================== */

        .satori-brand-strip {

            position: relative;

            margin:
                0
                auto
                56px;

            padding:
                28px
                0;

            overflow: hidden;

            background:
                linear-gradient(
                    90deg,
                    #f7f5f1 0%,
                    #ffffff 50%,
                    #f7f5f1 100%
                );

            border-top:
                1px solid
                rgba(
                    0,
                    0,
                    0,
                    .08
                );

            border-bottom:
                1px solid
                rgba(
                    0,
                    0,
                    0,
                    .08
                );

        }


        .satori-brand-strip::after {

            content: "";

            position: absolute;

            right: -50px;

            top: -100px;

            width: 230px;

            height: 230px;

            border:
                1px solid
                rgba(
                    239,
                    9,
                    48,
                    .16
                );

            border-radius: 50%;

            pointer-events: none;

        }


        .satori-brand-strip .satori-container {

            position: relative;

            z-index: 1;

            display: grid;

            grid-template-columns:
                auto
                1fr
                auto;

            align-items: center;

            gap: 22px;

        }


        .satori-brand-strip-mark {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 48px;

            height: 48px;

            background:
                var(--satori-red);

            color: #fff;

            font-family:
                "Noto Serif JP",
                "Times New Roman",
                serif;

            font-size: 25px;

            line-height: 1;

        }


        .satori-brand-strip-content {

            min-width: 0;

        }


        .satori-brand-strip-content .satori-kicker {

            display: block;

            margin-bottom: 3px;

            color:
                var(--satori-red);

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 2px;

        }


        .satori-brand-strip-content h2 {

            margin: 0;

            font-family:
                "Barlow Condensed",
                Arial,
                sans-serif;

            font-size:
                clamp(
                    30px,
                    3vw,
                    46px
                );

            line-height: .85;

            font-weight: 900;

            letter-spacing: -.5px;

            color:
                var(--satori-black);

        }


        .satori-brand-strip-content h2 span {

            color:
                var(--satori-red);

        }


        .satori-brand-strip-content p {

            margin:
                8px
                0
                0;

            color:
                #666;

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 13px;

        }


        .satori-brand-strip-link {

            display: inline-flex;

            align-items: center;

            gap: 10px;

            padding:
                12px
                17px;

            color: #fff;

            background:
                var(--satori-black);

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: .4px;

            text-decoration: none;

            transition:
                background .2s ease,
                transform .2s ease;

        }


        .satori-brand-strip-link:hover {

            background:
                var(--satori-red);

            transform:
                translateY(-2px);

        }


        .satori-brand-strip-link span {

            font-size: 15px;

            line-height: 1;

        }


        /* =====================================================
           RECOMENDACIONES
        ====================================================== */

        .recommendations {

            width:
                min(
                    var(--satori-width),
                    calc(100% - 70px)
