<!DOCTYPE html>
<html lang="es">

<head>

    <link
        rel="icon"
        type="image/png"
        href="img/logo.png"
    >

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="SATORII · Checkout"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>
        Checkout | SATORII
    </title>


    <!-- =====================================================
         ESTILOS GLOBALES
    ====================================================== -->

    <link
        rel="stylesheet"
        href="/satorimode/css/style.css"
    >


    <style>

        /* =====================================================
           SATORII · CHECKOUT
        ====================================================== */


        :root {

            --checkout-red:
                #EF0930;

            --checkout-black:
                #111;

            --checkout-gray:
                #666;

            --checkout-border:
                #dedede;

            --checkout-light:
                #f7f7f7;

        }


        * {

            box-sizing:
                border-box;

        }


        html {

            scroll-behavior:
                smooth;

        }


        body {

            margin:
                0;

            background:
                #fff;

            color:
                var(--checkout-black);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        /* =====================================================
           HEADER
        ====================================================== */

        .checkout-header {

            position:
                relative;

            z-index:
                20;

            height:
                82px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            padding:
                0 45px;

            border-bottom:
                1px solid
                #e8e8e8;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .96
                );

        }


        .checkout-logo {

            color:
                #111;

            font-size:
                25px;

            font-weight:
                950;

            font-style:
                italic;

            letter-spacing:
                -1.5px;

            text-decoration:
                none;

        }


        .checkout-center-label {

            position:
                absolute;

            left:
                50%;

            transform:
                translateX(-50%);

            color:
                #111;

            font-size:
                9px;

            font-weight:
                900;

            letter-spacing:
                4px;

        }


        .checkout-back {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                8px;

            color:
                #555;

            font-size:
                9px;

            font-weight:
                800;

            letter-spacing:
                .8px;

            text-decoration:
                none;

            transition:
                color .2s ease;

        }


        .checkout-back:hover {

            color:
                var(--checkout-red);

        }


        /* =====================================================
           CONTENEDOR
        ====================================================== */

        .checkout-page {

            width:
                min(
                    1450px,
                    calc(
                        100% - 60px
                    )
                );

            margin:
                0 auto;

            padding:
                70px 0 0;

        }


        /* =====================================================
           LAYOUT
        ====================================================== */

        .checkout-layout {

            display:
                grid;

            grid-template-columns:
                minmax(
                    0,
                    1fr
                )
                440px;

            gap:
                75px;

            align-items:
                start;

        }


        /* =====================================================
           COLUMNA IZQUIERDA
        ====================================================== */

        .checkout-form-column {

            min-width:
                0;

            position:
                relative;

            padding-bottom:
                220px;

        }


        .checkout-intro {

            margin-bottom:
                45px;

        }


        .checkout-eyebrow {

            margin-bottom:
                12px;

            color:
                var(--checkout-red);

            font-size:
                9px;

            font-weight:
                900;

            letter-spacing:
                3px;

        }


        .checkout-intro h1 {

            max-width:
                650px;

            margin:
                0;

            color:
                #111;

            font-size:
                clamp(
                    45px,
                    6vw,
                    82px
                );

            line-height:
                .88;

            font-weight:
                950;

            letter-spacing:
                -5px;

        }


        .checkout-intro h1 span {

            color:
                var(--checkout-red);

        }


        .checkout-intro p {

            max-width:
                520px;

            margin:
                22px 0 0;

            color:
                #777;

            font-size:
                13px;

            line-height:
                1.7;

        }


        /* =====================================================
           SECCIONES
        ====================================================== */

        .checkout-section {

            margin-bottom:
                38px;

        }


        .checkout-section-header {

            display:
                flex;

            align-items:
                baseline;

            justify-content:
                space-between;

            gap:
                20px;

            margin-bottom:
                14px;

            padding-bottom:
                10px;

            border-bottom:
                1px solid
                #ddd;

        }


        .checkout-section-title {

            margin:
                0;

            color:
                #111;

            font-size:
                14px;

            font-weight:
                900;

            letter-spacing:
                -.2px;

        }


        .checkout-section-number {

            color:
                var(--checkout-red);

            font-size:
                9px;

            font-weight:
                900;

            letter-spacing:
                2px;

        }


        .checkout-section-description {

            margin:
                0 0 15px;

            color:
                #888;

            font-size:
                11px;

            line-height:
                1.5;

        }


        /* =====================================================
           INPUTS
        ====================================================== */

        .checkout-fields {

            display:
                grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap:
                10px;

        }


        .checkout-field {

            min-width:
                0;

        }


        .checkout-field.full {

            grid-column:
                1 / -1;

        }


        .checkout-field label {

            display:
                block;

            margin:
                0 0 6px;

            color:
                #555;

            font-size:
                9px;

            font-weight:
                800;

            letter-spacing:
                .5px;

        }


        .checkout-field input,
        .checkout-field select {

            width:
                100%;

            height:
                45px;

            padding:
                0 13px;

            border:
                1px solid
                #d7d7d7;

            border-radius:
                4px;

            outline:
                none;

            background:
                #fff;

            color:
                #111;

            font-family:
                inherit;

            font-size:
                12px;

            transition:
                border-color .2s ease,
                box-shadow .2s ease;

        }


        .checkout-field input::placeholder {

            color:
                #aaa;

        }


        .checkout-field input:focus,
        .checkout-field select:focus {

            border-color:
                #111;

            box-shadow:
                0 0 0 2px
                rgba(
                    239,
                    9,
                    48,
                    .08
                );

        }


        /* =====================================================
           CHECKBOX
        ====================================================== */

        .checkout-checkbox {

            display:
                flex;

            align-items:
                center;

            gap:
                9px;

            margin-top:
                13px;

            color:
                #555;

            font-size:
                10px;

            line-height:
                1.4;

            cursor:
                pointer;

        }


        .checkout-checkbox input {

            width:
                16px;

            height:
                16px;

            margin:
                0;

            accent-color:
                var(--checkout-red);

        }


        /* =====================================================
           ENVÍO
        ====================================================== */

        .checkout-shipping-box {

            display:
                flex;

            align-items:
                center;

            gap:
                14px;

            min-height:
                65px;

            padding:
                15px;

            background:
                #f7f7f7;

            border:
                1px solid
                #e4e4e4;

            border-radius:
                5px;

        }


        .checkout-shipping-icon {

            width:
                34px;

            height:
                34px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            flex-shrink:
                0;

            border:
                1px solid
                #ddd;

            border-radius:
                50%;

            background:
                #fff;

            font-size:
                14px;

        }


        .checkout-shipping-content {

            flex:
                1;

        }


        .checkout-shipping-title {

            color:
                #111;

            font-size:
                11px;

            font-weight:
                900;

        }


        .checkout-shipping-text {

            margin-top:
                3px;

            color:
                #888;

            font-size:
                10px;

        }


        .checkout-shipping-price {

            color:
                #111;

            font-size:
                11px;

            font-weight:
                900;

            white-space:
                nowrap;

        }


        /* =====================================================
           FLOW
        ====================================================== */

        .checkout-payment-box {

            overflow:
                hidden;

            border:
                1px solid
                #cfcfcf;

            border-radius:
                5px;

            background:
                #fff;

        }


        .checkout-payment-option {

            display:
                flex;

            align-items:
                center;

            gap:
                12px;

            min-height:
                58px;

            padding:
                0 16px;

            border-bottom:
                1px solid
                #ddd;

        }


        .checkout-radio {

            width:
                15px;

            height:
                15px;

            flex-shrink:
                0;

            border:
                1px solid
                #111;

            border-radius:
                50%;

            position:
                relative;

        }


        .checkout-radio::after {

            content:
                "";

            position:
                absolute;

            inset:
                3px;

            border-radius:
                50%;

            background:
                var(--checkout-red);

        }


        .checkout-payment-name {

            flex:
                1;

            color:
                #111;

            font-size:
                11px;

            font-weight:
                900;

        }


        .checkout-flow-logo {

            padding:
                4px 7px;

            border-radius:
                3px;

            background:
                #111;

            color:
                #fff;

            font-size:
                8px;

            font-weight:
                900;

            letter-spacing:
                1px;

        }


        .checkout-payment-description {

            padding:
                13px 16px;

            background:
                #f7f7f7;

            color:
                #777;

            font-size:
                10px;

            line-height:
                1.6;

        }


        /* =====================================================
           FACTURACIÓN
        ====================================================== */

        .checkout-billing-options {

            overflow:
                hidden;

            border:
                1px solid
                #ddd;

            border-radius:
                5px;

        }


        .checkout-billing-option {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

            min-height:
                48px;

            padding:
                0 14px;

            color:
                #444;

            font-size:
                10px;

            border-bottom:
                1px solid
                #e5e5e5;

            cursor:
                pointer;

        }


        .checkout-billing-option:last-child {

            border-bottom:
                0;

        }


        .checkout-billing-option input {

            accent-color:
                var(--checkout-red);

        }


        /* =====================================================
           BOTÓN
        ====================================================== */

        .checkout-submit {

            width:
                100%;

            min-height:
                56px;

            margin-top:
                22px;

            border:
                0;

            border-radius:
                4px;

            background:
                var(--checkout-red);

            color:
                #fff;

            font-family:
                inherit;

            font-size:
                10px;

            font-weight:
                900;

            letter-spacing:
                1.5px;

            cursor:
                pointer;

            transition:
                background .2s ease,
                transform .2s ease;

        }


        .checkout-submit:hover {

            background:
                #111;

            transform:
                translateY(
                    -1px
                );

        }


        .checkout-submit span {

            margin-left:
                8px;

            font-size:
                15px;

        }


        /* =====================================================
           BENEFICIOS
        ====================================================== */

        .checkout-benefits {

            display:
                grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap:
                20px;

            margin-top:
                35px;

            padding-top:
                25px;

            border-top:
                1px solid
                #ddd;

        }


        .checkout-benefit {

            display:
                flex;

            gap:
                10px;

        }


        .checkout-benefit-icon {

            color:
                var(--checkout-red);

            font-size:
                18px;

            line-height:
                1;

        }


        .checkout-benefit strong {

            display:
                block;

            color:
                #111;

            font-size:
                9px;

            font-weight:
                900;

        }


        .checkout-benefit span {

            display:
                block;

            margin-top:
                4px;

            color:
                #888;

            font-size:
                8px;

            line-height:
                1.4;

        }


        /* =====================================================
           PAISAJE JAPONÉS
        ====================================================== */

        .checkout-landscape {

            position:
                absolute;

            left:
                0;

            right:
                0;

            bottom:
                0;

            height:
                230px;

            overflow:
                hidden;

            pointer-events:
                none;

            z-index:
                0;

        }


        .checkout-landscape::before {

            content:
                "";

            position:
                absolute;

            left:
                0;

            right:
                0;

            bottom:
                0;

            height:
                100%;

            background:

                linear-gradient(
                    to top,
                    rgba(
                        255,
                        255,
                        255,
                        1
                    ) 0%,
                    rgba(
                        255,
                        255,
                        255,
                        .65
                    ) 55%,
                    rgba(
                        255,
                        255,
                        255,
                        0
                    ) 100%
                );

            z-index:
                3;

        }


        .checkout-mountain {

            position:
                absolute;

            bottom:
                -45px;

            width:
                0;

            height:
                0;

            border-left:
                210px solid transparent;

            border-right:
                210px solid transparent;

            border-bottom:
                260px solid
                #ececec;

            opacity:
                .8;

        }


        .checkout-mountain.one {

            left:
                4%;

            transform:
                scale(
                    .75
                );

        }


        .checkout-mountain.two {

            left:
                25%;

            transform:
                scale(
                    1.1
                );

            border-bottom-color:
                #e4e4e4;

        }


        .checkout-mountain.three {

            left:
                51%;

            transform:
                scale(
                    .7
                );

            border-bottom-color:
                #ededed;

        }


        .checkout-mountain.four {

            right:
                -5%;

            transform:
                scale(
                    1.15
                );

            border-bottom-color:
                #e5e5e5;

        }


        .checkout-snow {

            position:
                absolute;

            z-index:
                2;

            bottom:
                125px;

            left:
                29%;

            width:
                100px;

            height:
                55px;

            background:
                #fff;

            clip-path:
                polygon(
                    50% 0,
                    100% 100%,
                    0 100%
                );

            opacity:
                .95;

        }


        /* =====================================================
           TORII
        ====================================================== */

        .checkout-torii {

            position:
                absolute;

            z-index:
                5;

            right:
                17%;

            bottom:
                15px;

            width:
                90px;

            height:
                145px;

            opacity:
                .75;

        }


        .checkout-torii::before,
        .checkout-torii::after {

            content:
                "";

            position:
                absolute;

            bottom:
                0;

            width:
                8px;

            height:
                115px;

            background:
                #555;

        }


        .checkout-torii::before {

            left:
                14px;

        }


        .checkout-torii::after {

            right:
                14px;

        }


        .checkout-torii-top {

            position:
                absolute;

            top:
                15px;

            left:
                0;

            width:
                90px;

            height:
                9px;

            background:
                #555;

        }


        .checkout-torii-middle {

            position:
                absolute;

            top:
                32px;

            left:
                8px;

            width:
                74px;

            height:
                7px;

            background:
                #777;

        }


        /* =====================================================
           RESUMEN
        ====================================================== */

        .checkout-summary {

            position:
                sticky;

            top:
                30px;

            padding:
                28px;

            background:
                #fafafa;

            border:
                1px solid
                #dedede;

            border-radius:
                6px;

        }


        .checkout-summary-label {

            display:
                block;

            margin-bottom:
                15px;

            color:
                var(--checkout-red);

            font-size:
                9px;

            font-weight:
                900;

            letter-spacing:
                2.5px;

        }


        .checkout-summary h2 {

            margin:
                0 0 25px;

            color:
                #111;

            font-size:
                25px;

            font-weight:
                950;

            letter-spacing:
                -1px;

        }


        /* =====================================================
           PRODUCTOS
        ====================================================== */

        .checkout-products {

            max-height:
                400px;

            overflow-y:
                auto;

        }


        .checkout-product {

            display:
                grid;

            grid-template-columns:
                70px
                minmax(
                    0,
                    1fr
                )
                auto;

            gap:
                13px;

            padding:
                15px 0;

            border-top:
                1px solid
                #ddd;

        }


        .checkout-product-image {

            position:
                relative;

            width:
                70px;

            height:
                70px;

            overflow:
                hidden;

            border-radius:
                4px;

            background:
                #eee;

        }


        .checkout-product-image img {

            width:
                100%;

            height:
                100%;

            display:
                block;

            object-fit:
                cover;

        }


        .checkout-product-quantity {

            position:
                absolute;

            top:
                -5px;

            right:
                -5px;

            min-width:
                19px;

            height:
                19px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                0 5px;

            border:
                2px solid
                #fff;

            border-radius:
                20px;

            background:
                #111;

            color:
                #fff;

            font-size:
                8px;

            font-weight:
                900;

        }


        .checkout-product-info {

            min-width:
                0;

        }


        .checkout-product-category {

            margin-bottom:
                5px;

            color:
                var(--checkout-red);

            font-size:
                8px;

            font-weight:
                900;

            letter-spacing:
                1.5px;

        }


        .checkout-product-name {

            margin:
                0;

            color:
                #111;

            font-size:
                11px;

            font-weight:
                900;

            line-height:
                1.3;

        }


        .checkout-product-options {

            margin-top:
                5px;

            color:
                #888;

            font-size:
                9px;

            line-height:
                1.5;

        }


        .checkout-product-price {

            color:
                #111;

            font-size:
                10px;

            font-weight:
                900;

            white-space:
                nowrap;

        }


        /* =====================================================
           CUPÓN
        ====================================================== */

        .checkout-discount {

            display:
                grid;

            grid-template-columns:
                1fr
                auto;

            gap:
                8px;

            margin-top:
                22px;

        }


        .checkout-discount input {

            width:
                100%;

            height:
                42px;

            padding:
                0 12px;

            border:
                1px solid
                #d5d5d5;

            border-radius:
                4px;

            outline:
                none;

            font-family:
                inherit;

            font-size:
                10px;

        }


        .checkout-discount button {

            height:
                42px;

            padding:
                0 14px;

            border:
                0;

            border-radius:
                4px;

            background:
                #111;

            color:
                #fff;

            font-size:
                9px;

            font-weight:
                900;

            cursor:
                pointer;

        }


        .checkout-discount button:hover {

            background:
                var(--checkout-red);

        }


        /* =====================================================
           TOTALES
        ====================================================== */

        .checkout-totals {

            margin-top:
                25px;

            border-top:
                1px solid
                #ddd;

        }


        .checkout-total-row {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                15px;

            padding:
                11px 0;

            color:
                #666;

            font-size:
                10px;

        }


        .checkout-total-row strong {

            color:
                #111;

            font-size:
                11px;

        }


        .checkout-grand-total {

            display:
                flex;

            align-items:
                flex-end;

            justify-content:
                space-between;

            gap:
                20px;

            margin-top:
                5px;

            padding-top:
                17px;

            border-top:
                1px solid
                #111;

        }


        .checkout-grand-total span {

            color:
                #111;

            font-size:
                14px;

            font-weight:
                900;

        }


        .checkout-grand-total strong {

            color:
                var(--checkout-red);

            font-size:
                25px;

            font-weight:
                950;

            letter-spacing:
                -1px;

        }


        .checkout-tax {

            margin-top:
                7px;

            color:
                #999;

            font-size:
                8px;

            text-align:
                right;

        }


        /* =====================================================
           CONFIANZA
        ====================================================== */

        .checkout-summary-benefits {

            margin-top:
                25px;

            padding-top:
                20px;

            border-top:
                1px solid
                #ddd;

        }


        .checkout-summary-benefit {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

            margin-bottom:
                13px;

        }


        .checkout-summary-benefit:last-child {

            margin-bottom:
                0;

        }


        .checkout-summary-benefit-icon {

            width:
                27px;

            height:
                27px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border:
                1px solid
                #ddd;

            border-radius:
                50%;

            background:
                #fff;

            color:
                var(--checkout-red);

            font-size:
                12px;

        }

            "satorimode_cart";


        const checkoutRoot =
            document.getElementById(
                "checkout-root"
            );


        /* =====================================================
           CARRITO
        ====================================================== */

        function getCart() {

            try {

                const saved =
                    localStorage.getItem(
                        CART_KEY
                    );


                if (!saved) {

                    return [];

                }


                const cart =
                    JSON.parse(
                        saved
                    );


                return Array.isArray(
                    cart
                )
                    ? cart
                    : [];

            }

            catch (
                error
            ) {

                console.error(
                    "SATORII · Error leyendo carrito:",
                    error
                );

                return [];

            }

        }


        /* =====================================================
           PRECIO
        ====================================================== */

        function formatPrice(
            value
        ) {

            return new Intl.NumberFormat(
                "es-CL",
                {
                    style:
                        "currency",

                    currency:
                        "CLP",

                    maximumFractionDigits:
                        0
                }
            )
            .format(
                Number(
                    value
                ) || 0
            );

        }


        /* =====================================================
           ESCAPE
        ====================================================== */

        function escapeHTML(
            value
        ) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }

           RENDER
        ====================================================== */
