<!DOCTYPE html>
<html lang="es">

<head>

    <link
        rel="icon"
        type="image/png"
        href="/satorimode/img/logo.png"
    >

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Finaliza tu compra en SATORII."
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>Checkout | SATORII</title>

    <link
        rel="stylesheet"
        href="/satorimode/css/style.css"
    >


    <style>

        /* =====================================================
           SATORII · CHECKOUT
        ====================================================== */

        :root {

            --checkout-red:
                #EF0930;

            --checkout-black:
                #111111;

            --checkout-dark:
                #111827;

            --checkout-gray:
                #777;

            --checkout-border:
                #dedede;

            --checkout-bg:
                #f7f7f7;

        }


        * {

            box-sizing:
                border-box;

        }


        body {

            margin:0;

            background:#fff;

            color:
                var(--checkout-black);

        }


        /* =====================================================
           HEADER CHECKOUT
        ====================================================== */

        .satori-checkout-header {

            width:100%;

            height:82px;

            display:flex;

            align-items:center;

            justify-content:center;

            padding:
                0 30px;

            border-bottom:
                1px solid #e5e5e5;

            background:#fff;

        }


        .satori-checkout-logo {

            display:block;

            width:
                125px;

            height:auto;

        }


        /* =====================================================
           PÁGINA
        ====================================================== */

        .satori-checkout-page {

            width:100%;

            min-height:100vh;

            padding:
                55px 30px 90px;

            background:#fff;

        }


        .satori-checkout-container {

            width:min(
                1180px,
                100%
            );

            margin:
                0 auto;

        }


        /* =====================================================
           GRID PRINCIPAL
        ====================================================== */

        .satori-checkout-layout {

            display:grid;

            grid-template-columns:
                minmax(0, 1fr)
                390px;

            gap:70px;

            align-items:start;

        }


        /* =====================================================
           TITULOS
        ====================================================== */

        .satori-checkout-label {

            display:block;

            margin-bottom:10px;

            color:
                var(--checkout-red);

            font-size:10px;

            font-weight:900;

            letter-spacing:3px;

        }


        .satori-checkout-section {

            margin-bottom:45px;

        }


        .satori-checkout-section h1 {

            margin:
                0 0 25px;

            color:
                var(--checkout-black);

            font-size:32px;

            line-height:1;

            font-weight:900;

            letter-spacing:-1.5px;

        }


        .satori-checkout-section h2 {

            margin:
                0 0 20px;

            color:
                var(--checkout-black);

            font-size:20px;

            line-height:1.1;

            font-weight:900;

        }


        .satori-checkout-description {

            margin:
                -10px 0 22px;

            color:
                var(--checkout-gray);

            font-size:12px;

            line-height:1.6;

        }


        /* =====================================================
           FORMULARIOS
        ====================================================== */

        .satori-checkout-form {

            display:grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(0,1fr)
                );

            gap:14px;

        }


        .satori-checkout-field {

            display:flex;

            flex-direction:column;

            gap:6px;

        }


        .satori-checkout-field.full {

            grid-column:
                1 / -1;

        }


        .satori-checkout-field label {

            color:#444;

            font-size:10px;

            font-weight:800;

            letter-spacing:.5px;

        }


        .satori-checkout-field input,
        .satori-checkout-field select {

            width:100%;

            min-height:48px;

            padding:
                0 14px;

            border:
                1px solid
                var(--checkout-border);

            border-radius:6px;

            background:#fff;

            color:#111;

            outline:none;

            font-family:inherit;

            font-size:13px;

            transition:
                border-color .2s ease,
                box-shadow .2s ease;

        }


        .satori-checkout-field input:focus,
        .satori-checkout-field select:focus {

            border-color:
                var(--checkout-black);

            box-shadow:
                0 0 0 2px
                rgba(
                    17,
                    17,
                    17,
                    .06
                );

        }


        .satori-checkout-field input::placeholder {

            color:#aaa;

        }


        /* =====================================================
           CONTACTO
        ====================================================== */

        .satori-checkout-contact-login {

            display:flex;

            align-items:center;

            justify-content:space-between;

            gap:15px;

            margin-bottom:20px;

        }


        .satori-checkout-contact-login span {

            color:#777;

            font-size:12px;

        }


        .satori-checkout-login {

            color:
                var(--checkout-black);

            font-size:11px;

            font-weight:800;

            text-decoration:
                underline;

        }


        .satori-checkout-checkbox {

            display:flex;

            align-items:center;

            gap:9px;

            margin-top:14px;

            color:#777;

            font-size:11px;

            cursor:pointer;

        }


        .satori-checkout-checkbox input {

            width:15px;

            height:15px;

            accent-color:
                var(--checkout-red);

        }


        /* =====================================================
           MÉTODOS DE PAGO
        ====================================================== */

        .satori-payment-box {

            border:
                1px solid
                var(--checkout-border);

            border-radius:8px;

            overflow:hidden;

        }


        .satori-payment-option {

            display:flex;

            align-items:center;

            gap:13px;

            min-height:64px;

            padding:
                0 18px;

            border-bottom:
                1px solid
                var(--checkout-border);

            cursor:pointer;

        }


        .satori-payment-option:last-child {

            border-bottom:0;

        }


        .satori-payment-option input {

            width:17px;

            height:17px;

            accent-color:
                var(--checkout-red);

        }


        .satori-payment-option-content {

            flex:1;

        }


        .satori-payment-option-title {

            display:block;

            color:#111;

            font-size:12px;

            font-weight:900;

        }


        .satori-payment-option-description {

            display:block;

            margin-top:3px;

            color:#888;

            font-size:10px;

        }


        .satori-payment-logo {

            display:flex;

            align-items:center;

            gap:5px;

            color:#111;

            font-size:10px;

            font-weight:900;

        }


        .satori-payment-logo span {

            padding:
                4px 6px;

            border:
                1px solid #ddd;

            border-radius:3px;

            font-size:8px;

        }


        /* =====================================================
           ENVÍO
        ====================================================== */

        .satori-shipping-options {

            display:flex;

            flex-direction:column;

            border:
                1px solid
                var(--checkout-border);

            border-radius:8px;

            overflow:hidden;

        }


        .satori-shipping-option {

            display:flex;

            align-items:center;

            gap:13px;

            min-height:68px;

            padding:
                10px 16px;

            border-bottom:
                1px solid
                var(--checkout-border);

            cursor:pointer;

        }


        .satori-shipping-option:last-child {

            border-bottom:0;

        }


        .satori-shipping-option input {

            width:17px;

            height:17px;

            accent-color:
                var(--checkout-red);

        }


        .satori-shipping-info {

            flex:1;

        }


        .satori-shipping-name {

            display:block;

            color:#111;

            font-size:12px;

            font-weight:900;

        }


        .satori-shipping-description {

            display:block;

            margin-top:3px;

            color:#888;

            font-size:10px;

        }


        .satori-shipping-price {

            color:#111;

            font-size:12px;

            font-weight:900;

            white-space:nowrap;

        }


        /* =====================================================
           RESUMEN
        ====================================================== */

        .satori-checkout-summary {

            position:sticky;

            top:25px;

            padding:
                25px;

            background:
                #f8f8f8;

            border:
                1px solid #ddd;

            border-radius:8px;

        }


        .satori-summary-title {

            display:flex;

            align-items:center;

            justify-content:space-between;

            margin-bottom:22px;

        }


        .satori-summary-title h2 {

            margin:0;

            color:#111;

            font-size:20px;

            font-weight:900;

            letter-spacing:-.5px;

        }


        .satori-summary-count {

            color:#888;

            font-size:10px;

            font-weight:800;

        }


        /* =====================================================
           PRODUCTO RESUMEN
        ====================================================== */

        .satori-summary-products {

            display:flex;

            flex-direction:column;

            gap:15px;

            padding-bottom:20px;

            border-bottom:
                1px solid #ddd;

        }


        .satori-summary-product {

            display:grid;

            grid-template-columns:
                64px
                minmax(0,1fr)
                auto;

            gap:12px;

            align-items:center;

        }


        .satori-summary-image {

            position:relative;

            width:64px;

            height:64px;

            overflow:hidden;

            border-radius:5px;

            background:#eee;

        }


        .satori-summary-image img {

            width:100%;

            height:100%;

            display:block;

            object-fit:cover;

        }


        .satori-summary-quantity {

            position:absolute;

            top:-5px;

            right:-5px;

            min-width:19px;

            height:19px;

            display:flex;

            align-items:center;

            justify-content:center;

            padding:0 5px;

            border-radius:50%;

            background:
                var(--checkout-dark);

            color:#fff;

            font-size:9px;

            font-weight:900;

        }


        .satori-summary-product-name {

            color:#111;

            font-size:12px;

            font-weight:800;

            line-height:1.3;

        }


        .satori-summary-product-options {

            margin-top:4px;

            color:#888;

            font-size:9px;

            line-height:1.4;

        }


        .satori-summary-product-price {

            color:#111;

            font-size:11px;

            font-weight:900;

            white-space:nowrap;

        }


        /* =====================================================
           CUPÓN
        ====================================================== */

        .satori-discount {

            display:flex;

            gap:8px;

            margin:
                20px 0;

        }


        .satori-discount input {

            flex:1;

            min-width:0;

            height:42px;

            padding:
                0 12px;

            border:
                1px solid #ccc;

            border-radius:5px;

            background:#fff;

            outline:none;

            font-family:inherit;

            font-size:11px;

        }


        .satori-discount button {

            min-width:80px;

            padding:
                0 12px;

            border:
                1px solid #111;

            border-radius:5px;

            background:#fff;

            color:#111;

            font-size:9px;

            font-weight:900;

            letter-spacing:.5px;

            cursor:pointer;

        }


        .satori-discount button:hover {

            background:#111;

            color:#fff;

        }


        .satori-discount-message {

            display:none;

            margin-top:-12px;

            margin-bottom:15px;

            color:
                var(--checkout-red);

            font-size:10px;

        }


        /* =====================================================
           TOTALES
        ====================================================== */

        .satori-summary-total-row {

            display:flex;

            align-items:center;

            justify-content:space-between;

            gap:20px;

            padding:
                11px 0;

            border-top:
                1px solid #ddd;

        }


        .satori-summary-total-row span {

            color:#666;

            font-size:10px;

            font-weight:700;

        }


        .satori-summary-total-row strong {

            color:#111;

            font-size:13px;

            font-weight:900;

        }


        .satori-summary-grand {

            margin-top:8px;

            padding-top:17px;

            border-top:
                1px solid #111;

        }


        .satori-summary-grand span {

            color:#111;

            font-size:12px;

            font-weight:900;

        }


        .satori-summary-grand strong {

            color:#111;

            font-size:24px;

            font-weight:900;

            letter-spacing:-1px;

        }


        /* =====================================================
           PAGAR
        ====================================================== */

        .satori-pay-button {

            width:100%;

            min-height:55px;

            margin-top:22px;

            border:0;

            border-radius:5px;

            background:
                var(--checkout-red);

            color:#fff;

            font-family:inherit;

            font-size:10px;

            font-weight:900;

            letter-spacing:1.5px;

            cursor:pointer;

            transition:
                background .2s ease,
                transform .2s ease;

        }


        .satori-pay-button:hover {

            background:#111;

            transform:
                translateY(-1px);

        }


        .satori-pay-button:disabled {

            opacity:.55;

            cursor:not-allowed;

            transform:none;

        }


        .satori-secure {

            margin-top:14px;

            color:#999;

            font-size:9px;

            line-height:1.6;

            text-align:center;

        }


        /* =====================================================
           FOOTER CHECKOUT
        ====================================================== */

        .satori-checkout-footer {

            margin-top:65px;

            padding-top:25px;

            border-top:
                1px solid #ddd;

        }


        .satori-checkout-footer-links {

            display:flex;

            flex-wrap:wrap;

            justify-content:center;

            gap:18px;

        }


        .satori-checkout-footer-links a {

            color:#777;

            font-size:9px;

            font-weight:700;

            text-decoration:none;

        }


        .satori-checkout-footer-links a:hover {

            color:
                var(--checkout-red);

        }


        /* =====================================================
           ERROR
        ====================================================== */

        .satori-checkout-error {

            display:none;

            margin-bottom:20px;

            padding:
                13px 15px;

            border:
                1px solid
                rgba(
                    239,
                    9,
                    48,
                    .25
                );

            border-radius:5px;

            background:
                rgba(
                    239,
                    9,
                    48,
                    .05
                );

            color:
                var(--checkout-red);

            font-size:11px;

            font-weight:700;

        }


        /* =====================================================
           CARRITO VACÍO
        ====================================================== */

        .satori-checkout-empty {

            min-height:
                500px;

            display:flex;

            flex-direction:column;

            align-items:center;

            justify-content:center;

            text-align:center;

        }


        .satori-checkout-empty h1 {

            margin:0;

            font-size:
                clamp(
                    35px,
                    7vw,
                    65px
                );

            font-weight:900;

            letter-spacing:-3px;

        }


        .satori-checkout-empty p {

            max-width:450px;

            margin:
                18px 0 28px;

            color:#777;

            font-size:13px;

            line-height:1.7;

        }


        .satori-checkout-empty a {

            display:inline-flex;

            align-items:center;

            justify-content:center;

            min-height:48px;

            padding:
                0 25px;

            background:#111;

            color:#fff;

            text-decoration:none;

            font-size:10px;

            font-weight:900;

            letter-spacing:1px;

            border-radius:4px;

        }


        /* =====================================================
           TABLET
        ====================================================== */

        @media (
            max-width:950px
        ) {

            .satori-checkout-layout {

                grid-template-columns:
                    1fr;

                gap:45px;

            }


            .satori-checkout-summary {

                position:static;

                order:-1;

            }

        }


        /* =====================================================
           MÓVIL
        ====================================================== */

        @media (
            max-width:650px
        ) {

            .satori-checkout-header {

                height:68px;

            }


            .satori-checkout-logo {

                width:105px;

            }


            .satori-checkout-page {

                padding:
                    30px 16px 60px;

            }


            .satori-checkout-form {

                grid-template-columns:
                    1fr;

            }


            .satori-checkout-field.full {

                grid-column:auto;

            }


            .satori-checkout-section {

                margin-bottom:35px;

            }


            .satori-checkout-section h1 {

                font-size:27px;

            }


            .satori-checkout-summary {

                padding:20px;

            }


            .satori-summary-products {

                max-height:260px;

                overflow:auto;

            }


            .satori-checkout-contact-login {

                align-items:flex-start;

                flex-direction:column;

                gap:7px;

            }


            .satori-checkout-footer-links {

                gap:
                    10px 15px;

            }

        }


    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="satori-checkout-header">

        <a
            href="/satorimode/index.html"
            aria-label="Volver a SATORII"
        >

            <img
                src="/satorimode/img/logo.png"
                alt="SATORII"
                class="satori-checkout-logo"
            >

        </a>

    </header>


    <!-- =====================================================
         CONTENIDO
    ====================================================== -->

    <main class="satori-checkout-page">

        <div
            class="satori-checkout-container"
            id="checkout-container"
        >

            <!-- JS -->

        </div>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div id="satori-footer"></div>


    <script
        src="/satorimode/js/footer.js"
    ></script>


    <!-- =====================================================
         CHECKOUT
    ====================================================== -->

    <script>

        "use strict";


        /* =====================================================
           CONFIGURACIÓN
        ====================================================== */

        const CART_KEY =
            "satorimode_cart";


        const checkoutContainer =
            document.getElementById(
                "checkout-container"
            );


        /* =====================================================
           UTILIDADES
        ====================================================== */

        function escapeHTML(
            value
        ) {

            return String(
                value ?? ""
            )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

        }


        function formatPrice(
            price
        ) {

            return new Intl.NumberFormat(
                "es-CL",
                {
                    style:
                        "currency",

                    currency:
                        "CLP",

                    maximumFractionDigits:
                        0

                }
            )
            .format(
                Number(price) || 0
            );

        }


        function getCart() {

            try {

                const saved =
                    localStorage.getItem(
                        CART_KEY
                    );


                if (!saved) {

                    return [];

                }


                const cart =
                    JSON.parse(
                        saved
                    );


                return Array.isArray(
                    cart
                )
                    ? cart
                    : [];

            }
            catch (
                error
            ) {

                console.error(
                    "SATORII · Error leyendo carrito:",
                    error
                );

                return [];

            }

        }


        /* =====================================================
           CARRITO VACÍO
        ====================================================== */

        function renderEmpty() {

            checkoutContainer.innerHTML = `

                <section
                    class="satori-checkout-empty"
                >

                    <span
                        class="satori-checkout-label"
                    >
                        SATORII · CHECKOUT
                    </span>


                    <h1>
                        TU CARRITO ESTÁ VACÍO.
                    </h1>


                    <p>
                        Necesitas agregar al menos
                        un producto antes de continuar
                        con la compra.
                    </p>


                    <a
                        href="/satorimode/productos.html"
                    >
                        EXPLORAR PRODUCTOS
                    </a>

                </section>

            `;

        }


        /* =====================================================
           CHECKOUT
        ====================================================== */

        function renderCheckout() {

            const cart =
                getCart();


            if (
                cart.length === 0
            ) {

                renderEmpty();

                return;

            }


            let subtotal =
                0;

            let totalItems =
                0;


            cart.forEach(
                function (
                    product
                ) {

                    const quantity =
                        Math.max(
                            1,
                            Number(
                                product.quantity || 1
                            )
                        );


                    const price =
                        Number(
                            product.price || 0
                        );


                    subtotal +=
                        price *
                        quantity;


                    totalItems +=
                        quantity;

                }
            );


            /*
             * Por ahora el envío es 0.
             *
             * Cuando conectemos el backend
             * podremos calcularlo según
             * comuna / región / método.
             */

            const shipping =
                0;


            const total =
                subtotal +
                shipping;


            /* =================================================
               PRODUCTOS
            ================================================== */

            let productsHTML =
                "";


            cart.forEach(
                function (
                    product
                ) {

                    const quantity =
                        Math.max(
                            1,
                            Number(
                                product.quantity || 1
                            )
                        );


                    const itemTotal =
                        Number(
                            product.price || 0
                        ) *
                        quantity;


                    let options =
                        "";


                    if (
                        product.size
                    ) {

                        options +=
                            "Talla: " +
                            escapeHTML(
                                product.size
                            );

                    }


                    if (
                        product.color
                    ) {

                        if (
                            options
                        ) {

                            options +=
                                " · ";

                        }


                        options +=
                            "Color: " +
                            escapeHTML(
                                product.color
                            );

                    }


                    productsHTML += `

                        <article
                            class="
                                satori-summary-product
                            "
                        >

                            <div
                                class="
                                    satori-summary-image
                                "
                            >

                                <img
                                    src="${escapeHTML(
                                        product.image || ""
                                    )}"
                                    alt="${escapeHTML(
                                        product.name ||
                                        "Producto SATORII"
                                    )}"
                                >


                                <span
                                    class="
                                        satori-summary-quantity
                                    "
                                >
                                    ${quantity}
                                </span>

                            </div>


                            <div>

                                <div
                                    class="
                                        satori-summary-product-name
                                    "
                                >
                                    ${escapeHTML(
                                        product.name ||
                                        "Producto"
                                    )}
                                </div>


                                ${
                                    options
                                        ? `
                                            <div
                                                class="
                                                    satori-summary-product-options
                                                "
                                            >
                                                ${options}
                                            </div>
                                        `
                                        : ""
                                }

                            </div>


                            <strong
                                class="
                                    satori-summary-product-price
                                "
                            >
                                ${formatPrice(
                                    itemTotal
                                )}
                            </strong>

                        </article>

                    `;

                }

        /* =====================================================
           INICIALIZAR
        ====================================================== */

        function initializeCheckout(
            subtotal
        ) {

            const payButton =
                document.getElementById(
                    "satori-pay-button"
                );


            const errorBox =
                document.getElementById(
                    "checkout-error"
                );


            /* =================================================
               RUT
            ================================================= */

            const rutInput =
                document.getElementById(
                    "checkout-rut"
                );


            rutInput?.addEventListener(
                "input",
                function () {

                    let value =
                        this.value
                            .replace(
                                /[^0-9kK]/g,
                                ""
                            )
                            .toUpperCase();


                    if (
                        value.length > 1
                    ) {

                        const body =
                            value.slice(
                                0,
                                -1
                            );


                        const dv =
                            value.slice(
                                -1
                            );


                        const formatted =
                            body
                                .replace(
                                    /\B(?=(\d{3})+(?!\d))/g,
                                    "."
                                );


                        this.value =
                            formatted +
                            "-" +
                            dv;

                    }

                }
            );


            /* =================================================
               DESCUENTO
            ================================================= */

            document
                .getElementById(
                    "checkout-discount-button"
                )
                ?.addEventListener(
                    "click",
                    function () {

                        const input =
                            document.getElementById(
                                "checkout-discount"
                            );


                        const message =
                            document.getElementById(
                                "checkout-discount-message"
                            );


                        const code =
                            input
                                .value
                                .trim()
                                .toUpperCase();


                        if (!code) {

                            message.textContent =
                                "Ingresa un código de descuento.";

                            message.style.display =
                                "block";

                            return;

                        }


                        /*
                         * Todavía no tenemos
                         * sistema de cupones/backend.
                         */

                        message.textContent =
                            "Este código se validará durante el proceso de compra.";

                        message.style.display =
                            "block";

                    }
                );


            /* =================================================
               PAGAR
            ================================================= */

            payButton?.addEventListener(
                "click",
                function () {

                    errorBox.style.display =
                        "none";


                    /* =========================================
                       VALIDAR FORMULARIO
                    ========================================== */

                    const requiredFields =
                        document.querySelectorAll(
                            "#checkout-container [required]"
                        );


                    for (
                        const field of requiredFields
                    ) {

                        if (
                            !field.value.trim()
                        ) {

                            field.focus();


                            errorBox.textContent =
                                "Completa todos los campos obligatorios antes de continuar.";


                            errorBox.style.display =
                                "block";


                            return;

                        }

                    }


                    /* =========================================
                       VALIDAR EMAIL
                    ========================================== */

                    const email =
                        document
                            .getElementById(
                                "checkout-email"
                            )
                            .value
                            .trim();


                    if (
                        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
                            .test(
                                email
                            )
                    ) {

                        document
                            .getElementById(
                                "checkout-email"
                            )
                            .focus();


                        errorBox.textContent =
                            "Ingresa un correo electrónico válido.";


                        errorBox.style.display =
                            "block";


                        return;

                    }


                    /* =========================================
                       ESTADO ACTUAL
                    ========================================== */

                    /*
                     * AQUÍ todavía NO hacemos
                     * la llamada a Flow.
                     *
                     * En la siguiente etapa:
                     *
                     * checkout.html
                     *       ↓
                     * /api/create-payment
                     *       ↓
                     * Flow
                     */

                    payButton.disabled =
                        true;


                    payButton.textContent =
                        "PREPARANDO PAGO...";


                    /*
                     * Por ahora mostramos
                     * un mensaje hasta que
                     * conectemos el backend.
                     */

                    setTimeout(
                        function () {

                            payButton.disabled =
                                false;


                            payButton.textContent =
                                "PAGAR AHORA";


                            errorBox.textContent =
                                "El pago estará disponible cuando conectemos SATORII con Flow.";


                            errorBox.style.display =
                                "block";

                        },
                        600
                    );

                }
            );

        }


        /* =====================================================
           INICIO
        ====================================================== */

        if (
            document.readyState ===
            "loading"
        ) {

            document.addEventListener(
                "DOMContentLoaded",
                renderCheckout
            );

        }

        else {

            renderCheckout();

        }

    </script>
