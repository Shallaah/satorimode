<!DOCTYPE html>
<html lang="es">

<head>

    <link
        rel="icon"
        type="image/png"
        href="img/logo.png"
    >

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Finaliza tu compra en SATORII."
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>Checkout | SATORII</title>

    <link
        rel="stylesheet"
        href="/satorimode/css/style.css"
    >


    <style>

        /* =====================================================
           SATORII · CHECKOUT
        ====================================================== */

        :root {

            --checkout-red: #EF0930;
            --checkout-black: #111;
            --checkout-gray: #777;
            --checkout-border: #dddddd;
            --checkout-bg: #f7f7f7;

        }


        * {

            box-sizing:
                border-box;

        }


        body {

            margin: 0;

            background: #fff;

            color:
                var(--checkout-black);

        }


        /* =====================================================
           HEADER CHECKOUT
        ====================================================== */

        .checkout-header {

            width: 100%;

            min-height: 82px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                18px 25px;

            border-bottom:
                1px solid #e5e5e5;

            background: #fff;

        }


        .checkout-header a {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            text-decoration: none;

        }


        .checkout-logo {

            width: 125px;

            height: auto;

            display: block;

        }


        /* =====================================================
           PÁGINA
        ====================================================== */

        .checkout-page {

            width: min(
                1200px,
                calc(
                    100% - 40px
                )
            );

            margin:
                0 auto;

            padding:
                55px 0 90px;

        }


        /* =====================================================
           CABECERA
        ====================================================== */

        .checkout-heading {

            margin-bottom:
                45px;

        }


        .checkout-label {

            display: block;

            margin-bottom:
                10px;

            color:
                var(--checkout-red);

            font-size: 10px;

            font-weight: 900;

            letter-spacing: 3px;

        }


        .checkout-heading h1 {

            margin: 0;

            font-size:
                clamp(
                    42px,
                    6vw,
                    72px
                );

            line-height: .95;

            font-weight: 900;

            letter-spacing: -3px;

        }


        .checkout-heading p {

            max-width: 600px;

            margin:
                18px 0 0;

            color:
                var(--checkout-gray);

            font-size: 14px;

            line-height: 1.7;

        }


        /* =====================================================
           LAYOUT
        ====================================================== */

        .checkout-layout {

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                360px;

            gap: 55px;

            align-items:
                start;

        }


        /* =====================================================
           SECCIONES
        ====================================================== */

        .checkout-section {

            margin-bottom:
                42px;

        }


        .checkout-section-header {

            display: flex;

            align-items:
                baseline;

            justify-content:
                space-between;

            gap: 20px;

            margin-bottom:
                18px;

        }


        .checkout-section-label {

            color:
                var(--checkout-red);

            font-size: 9px;

            font-weight: 900;

            letter-spacing: 2px;

        }


        .checkout-section h2 {

            margin: 5px 0 0;

            font-size: 24px;

            line-height: 1.1;

            font-weight: 900;

            letter-spacing: -1px;

        }


        /* =====================================================
           CAMPOS
        ====================================================== */

        .checkout-fields {

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(0, 1fr)
                );

            gap: 12px;

        }


        .checkout-field {

            position: relative;

        }


        .checkout-field.full {

            grid-column:
                1 / -1;

        }


        .checkout-field label {

            position: absolute;

            top: 9px;

            left: 14px;

            z-index: 2;

            color: #777;

            font-size: 9px;

            font-weight: 600;

            pointer-events: none;

        }


        .checkout-field input,
        .checkout-field select {

            width: 100%;

            min-height: 58px;

            padding:
                24px 14px 8px;

            border:
                1px solid #d5d5d5;

            border-radius: 8px;

            outline: none;

            background: #fff;

            color: #111;

            font-family: inherit;

            font-size: 13px;

            transition:
                border-color .2s ease,
                box-shadow .2s ease;

        }


        .checkout-field input:focus,
        .checkout-field select:focus {

            border-color:
                var(--checkout-black);

            box-shadow:
                0 0 0 2px
                rgba(
                    17,
                    17,
                    17,
                    .06
                );

        }


        .checkout-field.error input,
        .checkout-field.error select {

            border-color:
                var(--checkout-red);

        }


        .checkout-error {

            display: none;

            margin-top: 5px;

            color:
                var(--checkout-red);

            font-size: 10px;

        }


        .checkout-field.error
        .checkout-error {

            display: block;

        }


        /* =====================================================
           CHECKBOX
        ====================================================== */

        .checkout-checkbox {

            display: flex;

            align-items: flex-start;

            gap: 10px;

            margin-top: 14px;

            cursor: pointer;

        }


        .checkout-checkbox input {

            width: 18px;

            height: 18px;

            margin: 0;

            accent-color:
                var(--checkout-red);

        }


        .checkout-checkbox span {

            color: #555;

            font-size: 12px;

            line-height: 1.5;

        }


        /* =====================================================
           MÉTODO DE ENVÍO
        ====================================================== */

        .checkout-method {

            display: flex;

            align-items: center;

            gap: 14px;

            padding: 18px;

            border:
                1px solid #d5d5d5;

            border-radius: 8px;

            cursor: pointer;

        }


        .checkout-method input {

            width: 18px;

            height: 18px;

            accent-color:
                var(--checkout-red);

        }


        .checkout-method-info {

            flex: 1;

        }


        .checkout-method-title {

            display: block;

            color: #111;

            font-size: 13px;

            font-weight: 800;

        }


        .checkout-method-description {

            display: block;

            margin-top: 4px;

            color: #777;

            font-size: 11px;

        }


        .checkout-method-price {

            color: #111;

            font-size: 12px;

            font-weight: 900;

            white-space: nowrap;

        }


        /* =====================================================
           PAGO
        ====================================================== */

        .checkout-payment-box {

            padding: 20px;

            border:
                1px solid #d5d5d5;

            border-radius: 8px;

            background: #fff;

        }


        .checkout-payment-option {

            display: flex;

            align-items: center;

            gap: 13px;

        }


        .checkout-payment-option input {

            width: 18px;

            height: 18px;

            accent-color:
                var(--checkout-red);

        }


        .checkout-payment-title {

            font-size: 13px;

            font-weight: 900;

        }


        .checkout-payment-description {

            margin-top: 12px;

            padding-top: 14px;

            border-top:
                1px solid #e5e5e5;

            color: #777;

            font-size: 11px;

            line-height: 1.6;

        }


        .checkout-flow-badge {

            display: inline-flex;

            align-items: center;

            margin-left: auto;

            padding:
                6px 9px;

            border-radius: 4px;

            background: #111;

            color: #fff;

            font-size: 8px;

            font-weight: 900;

            letter-spacing: 1px;

        }


        /* =====================================================
           RESUMEN
        ====================================================== */

        .checkout-summary {

            position: sticky;

            top: 30px;

            padding: 28px;

            background:
                #f7f7f7;

            border:
                1px solid #ddd;

            border-radius: 8px;

        }


        .checkout-summary-label {

            display: block;

            margin-bottom: 8px;

            color:
                var(--checkout-red);

            font-size: 9px;

            font-weight: 900;

            letter-spacing: 2px;

        }


        .checkout-summary h2 {

            margin:
                0 0 25px;

            font-size: 23px;

            font-weight: 900;

            letter-spacing: -1px;

        }


        /* =====================================================
           PRODUCTOS RESUMEN
        ====================================================== */

        .checkout-products {

            border-top:
                1px solid #ddd;

        }


        .checkout-product {

            display: grid;

            grid-template-columns:
                64px
                minmax(0, 1fr)
                auto;

            gap: 12px;

            padding:
                16px 0;

            border-bottom:
                1px solid #ddd;

        }


        .checkout-product-image {

            position: relative;

            width: 64px;

            height: 64px;

            overflow: hidden;

            border-radius: 5px;

            background: #eee;

        }


        .checkout-product-image img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

        }


        .checkout-product-quantity {

            position: absolute;

            top: -5px;

            right: -5px;

            min-width: 19px;

            height: 19px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                var(--checkout-red);

            color: #fff;

            font-size: 9px;

            font-weight: 900;

        }


        .checkout-product-info {

            min-width: 0;

        }


        .checkout-product-name {

            margin: 0;

            color: #111;

            font-size: 12px;

            font-weight: 800;

            line-height: 1.3;

        }


        .checkout-product-options {

            margin-top: 5px;

            color: #777;

            font-size: 9px;

            line-height: 1.5;

        }


        .checkout-product-price {

            color: #111;

            font-size: 11px;

            font-weight: 900;

            text-align: right;

            white-space: nowrap;

        }


        /* =====================================================
           TOTALES
        ====================================================== */

        .checkout-totals {

            margin-top: 15px;

        }


        .checkout-total-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            padding: 10px 0;

        }


        .checkout-total-row span {

            color: #666;

            font-size: 11px;

            font-weight: 700;

        }


        .checkout-total-row strong {

            color: #111;

            font-size: 13px;

            font-weight: 900;

        }


        .checkout-total-final {

            margin-top: 8px;

            padding-top: 17px;

            border-top:
                1px solid #ccc;

        }


        .checkout-total-final span {

            color: #111;

            font-size: 12px;

            font-weight: 900;

        }


        .checkout-total-final strong {

            color: #111;

            font-size: 24px;

            font-weight: 900;

        }


        /* =====================================================
           BOTÓN PAGAR
        ====================================================== */

        .checkout-pay {

            width: 100%;

            min-height: 54px;

            margin-top: 22px;

            border: 0;

            border-radius: 6px;

            background:
                var(--checkout-red);

            color: #fff;

            font-family: inherit;

            font-size: 11px;

            font-weight: 900;

            letter-spacing: 1px;

            cursor: pointer;

            transition:
                background .2s ease,
                transform .2s ease;

        }


        .checkout-pay:hover {

            background: #111;

            transform:
                translateY(-1px);

        }


        .checkout-pay:disabled {

            opacity: .5;

            cursor: not-allowed;

            transform: none;

        }


        /* =====================================================
           SEGURIDAD
        ====================================================== */

        .checkout-secure {

            margin-top: 14px;

            color: #888;

            font-size: 9px;

            line-height: 1.6;

            text-align: center;

        }


        /* =====================================================
           VOLVER
        ====================================================== */

        .checkout-back {

            display: inline-block;

            margin-top: 18px;

            color: #555;

            font-size: 10px;

            font-weight: 800;

            text-decoration: none;

        }


        .checkout-back:hover {

            color:
                var(--checkout-red);

        }


        /* =====================================================
           VACÍO
        ====================================================== */

        .checkout-empty {

            min-height: 55vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

        }


        .checkout-empty-label {

            color:
                var(--checkout-red);

            font-size: 10px;

            font-weight: 900;

            letter-spacing: 3px;

        }


        .checkout-empty h1 {

            margin:
                12px 0 10px;

            font-size:
                clamp(
                    32px,
                    6vw,
                    55px
                );

            font-weight: 900;

            letter-spacing: -2px;

        }


        .checkout-empty p {

            max-width: 450px;

            margin: 0 0 25px;

            color: #777;

            font-size: 13px;

            line-height: 1.7;

        }


        .checkout-empty a {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 48px;

            padding:
                0 28px;

            border-radius: 5px;

            background: #111;

            color: #fff;

            text-decoration: none;

            font-size: 10px;

            font-weight: 900;

            letter-spacing: 1px;

        }


        .checkout-empty a:hover {

            background:
                var(--checkout-red);

        }


        /* =====================================================
           FOOTER
        ====================================================== */

        .checkout-footer {

            padding:
                25px 20px 40px;

            border-top:
                1px solid #ddd;

            color: #888;

            font-size: 9px;

            text-align: center;

        }


        /* =====================================================
           TABLET
        ====================================================== */

        @media (
            max-width: 900px
        ) {

            .checkout-page {

                padding-top: 40px;

            }


            .checkout-layout {

                grid-template-columns: 1fr;

                gap: 20px;

            }


            .checkout-summary {

                position: static;

                grid-row: 1;

            }

        }


        /* =====================================================
           MÓVIL
        ====================================================== */

        @media (
            max-width: 600px
        ) {

            .checkout-header {

                min-height: 68px;

            }


            .checkout-logo {

                width: 105px;

            }


            .checkout-page {

                width:
                    calc(
                        100% - 30px
                    );

                padding:
                    35px 0 60px;

            }


            .checkout-heading {

                margin-bottom: 35px;

            }


            .checkout-heading h1 {

                font-size: 48px;

                letter-spacing: -2px;

            }


            .checkout-heading p {

                font-size: 13px;

            }


            .checkout-fields {

                grid-template-columns: 1fr;

            }


            .checkout-field.full {

                grid-column: auto;

            }


            .checkout-summary {

                padding: 22px;

            }


            .checkout-product {

                grid-template-columns:
                    58px
                    minmax(0, 1fr)
                    auto;

            }


            .checkout-product-image {

                width: 58px;

                height: 58px;

            }


            .checkout-product-name {

                font-size: 11px;

            }


            .checkout-product-price {

                font-size: 10px;

            }

        }


        /* =====================================================
           REDUCCIÓN DE MOVIMIENTO
        ====================================================== */

        @media (
            prefers-reduced-motion: reduce
        ) {

            * {

                scroll-behavior:
                    auto !important;

            }

            .checkout-pay {

                transition: none;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="checkout-header">

        <a
            href="/satorimode/index.html"
            aria-label="Volver a SATORII"
        >

            <img
                src="img/logo.png"
                alt="SATORII"
                class="checkout-logo"
            >

        </a>

    </header>


    <!-- =====================================================
         CONTENIDO
    ====================================================== -->

    <main class="checkout-page">

        <header class="checkout-heading">

            <span class="checkout-label">
                SATORII · CHECKOUT
            </span>


            <h1>
                FINALIZA<br>
                TU COMPRA.
            </h1>


            <p>
                Completa tus datos para preparar
                tu pedido. El pago será procesado
                de forma segura mediante Flow.
            </p>

        </header>


        <!-- =================================================
             CHECKOUT DINÁMICO
        ================================================== -->

        <div id="checkout-content"></div>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div class="checkout-footer">

        SATORII · SHOPPING EXPERIENCE

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        "use strict";


        /* =====================================================
           CONFIGURACIÓN
        ====================================================== */

        const CART_KEY =
            "satorimode_cart";


        const checkoutContent =
            document.getElementById(
                "checkout-content"
            );


        /* =====================================================
           CARRITO
        ====================================================== */

        function getCheckoutCart() {

            try {

                const saved =
                    localStorage.getItem(
                        CART_KEY
                    );


                if (!saved) {

                    return [];

                }


                const parsed =
                    JSON.parse(
                        saved
                    );


                return Array.isArray(
                    parsed
                )
                    ? parsed
                    : [];

            }
            catch (
                error
            ) {

                console.error(
                    "SATORII · Error leyendo carrito:",
                    error
                );

                return [];

            }

        }


        /* =====================================================
           PRECIO
        ====================================================== */

        function formatPrice(
            price
        ) {

            return new Intl.NumberFormat(
                "es-CL",
                {
                    style:
                        "currency",

                    currency:
                        "CLP",

                    maximumFractionDigits:
                        0
                }
            ).format(
                Number(price) || 0
            );

        }


        /* =====================================================
           ESCAPE
        ====================================================== */

        function escapeHTML(
            value
        ) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================================
           RENDER CHECKOUT
        ====================================================== */

        function renderCheckout() {

            const cart =
                getCheckoutCart();


            /* ================================================
               CARRITO VACÍO
            ================================================= */

            if (
                cart.length === 0
            ) {

                checkoutContent.innerHTML = `

                    <section
                        class="checkout-empty"
                    >

                        <span
                            class="checkout-empty-label"
                        >
                            SATORII · CHECKOUT
                        </span>


                        <h1>
                            TU CARRITO ESTÁ VACÍO.
                        </h1>


                        <p>
                            Necesitas agregar al menos
                            un producto antes de continuar
                            con la compra.
                        </p>


                        <a
                            href="/satorimode/productos.html"
                        >
                            VOLVER A PRODUCTOS
                        </a>

                    </section>

                `;

                return;

            }


            /* ================================================
               TOTALES
            ================================================= */

            let subtotal =
                0;

            let totalItems =
                0;


            cart.forEach(
                function (
                    product
                ) {

                    const quantity =
                        Math.max(
                            1,
                            Number(
                                product.quantity ||
                                1
                            )
                        );


                    const price =
                        Number(
                            product.price ||
                            0
                        );


                    subtotal +=
                        price *
                        quantity;


                    totalItems +=
                        quantity;

                }
            );


            /* ================================================
               PRODUCTOS
            ================================================= */

            let productsHTML =
                "";


            cart.forEach(
                function (
                    product
                ) {

                    const quantity =
                        Math.max(
                            1,
                            Number(
                                product.quantity ||
                                1
                            )
                        );


                    const price =
                        Number(
                            product.price ||
                            0
                        );


                    const total =
                        price *
                        quantity;


                    let options =
                        "";


                    if (
                        product.size
                    ) {

                        options +=
                            "Talla: " +
                            escapeHTML(
                                product.size
                            );

                    }


                    if (
                        product.color
                    ) {

                        if (
                            options
                        ) {

                            options +=
                                " · ";

                        }


                        options +=
                            "Color: " +
                            escapeHTML(
                                product.color
                            );

                    }


                    productsHTML += `

                        <article
                            class="checkout-product"
                        >

                            <div
                                class="checkout-product-image"
                            >

                                <img
                                    src="${escapeHTML(
                                        product.image ||
                                        ""
                                    )}"
                                    alt="${escapeHTML(
                                        product.name ||
                                        "Producto SATORII"
                                    )}"
                                >


                                <span
                                    class="
                                        checkout-product-quantity
                                    "
                                >
                                    ${quantity}
                                </span>

                            </div>


                            <div
                                class="checkout-product-info"
                            >

                                <h3
                                    class="
                                        checkout-product-name
                                    "
                                >
                                    ${escapeHTML(
                                        product.name ||
                                        "Producto"
                                    )}
                                </h3>


                                ${
                                    options
                                        ? `
                                            <div
                                                class="
                                                    checkout-product-options
                                                "
                                            >
                                                ${options}
                                            </div>
                                        `
                                        : ""
                                }

                            </div>


                            <div
                                class="
                                    checkout-product-price
                                "
                            >
                                ${formatPrice(
                                    total
                                )}
                            </div>

                        </article>

                    `;

                }
            );


            /* ================================================
               ESTRUCTURA
            ================================================= */

            checkoutContent.innerHTML = `

                <div
                    class="checkout-layout"
                >


                    <!-- ======================================
                         FORMULARIO
                    ======================================= -->

                    <div>


                        <!-- CONTACTO -->

                        <section
                            class="checkout-section"
                        >

                            <div
                                class="
                                    checkout-section-header
                                "
                            >

                                <div>

                                    <span
                                        class="
                                            checkout-section-label
                                        "
                                    >
                                        01 · CONTACTO
                                    </span>


                                    <h2>
                                        Tus datos
                                    </h2>

                                </div>

                            </div>


                            <div
                                class="checkout-fields"
                            >

                                <div
                                    class="
                                        checkout-field
                                        full
                                    "
                                >

                                    <label
                                        for="checkout-email"
                                    >
                                        Correo electrónico
                                    </label>


                                    <input
                                        id="checkout-email"
                                        type="email"
                                        autocomplete="email"
                                        placeholder="correo@ejemplo.com"
                                        required
                                    >


                                    <span
                                        class="checkout-error"
                                    >
                                        Ingresa un correo válido.
                                    </span>

                                </div>

                            </div>


                            <label
                                class="checkout-checkbox"
                            >

                                <input

        /* =====================================================
           VALIDAR RUT
        ====================================================== */

        function validateRut(
            rut
        ) {

            const clean =
                String(
                    rut || ""
                )
                .replace(
                    /[^0-9kK]/g,
                    ""
                )
                .toUpperCase();


            if (
                clean.length < 2
            ) {

                return false;

            }


            const body =
                clean.slice(
                    0,
                    -1
                );


            const verifier =
                clean.slice(
                    -1
                );


            if (
                !/^\d+$/.test(
                    body
                )
            ) {

                return false;

            }


            let sum =
                0;

            let multiplier =
                2;


            for (
                let i =
                    body.length - 1;

                i >= 0;

                i--
            ) {

                sum +=
                    Number(
                        body[i]
                    ) *
                    multiplier;


                multiplier =
                    multiplier === 7
                        ? 2
                        : multiplier + 1;

            }


            const remainder =
                11 -
                (
                    sum %
                    11
                );


            let expected;


            if (
                remainder === 11
            ) {

                expected = "0";

            }

            else if (
                remainder === 10
            ) {

                expected = "K";

            }

            else {

                expected =
                    String(
                        remainder
                    );

            }


            return (
                expected ===
                verifier
            );

        }


        /* =====================================================
           VALIDAR CHECKOUT
        ====================================================== */

        function validateCheckout() {

            let valid =
                true;


            const requiredFields = [

                "checkout-email",
                "checkout-name",
                "checkout-lastname",
                "checkout-rut",
                "checkout-phone",
                "checkout-address",
                "checkout-commune",
                "checkout-region"

            ];


            requiredFields.forEach(
                function (
                    id
                ) {

                    const field =
                        document.getElementById(
                            id
                        );


                    const wrapper =
                        field.closest(
                            ".checkout-field"
                        );


                    if (
                        !field.value.trim()
                    ) {

                        wrapper.classList.add(
                            "error"
                        );

                        valid = false;

                    }

                    else {

                        wrapper.classList.remove(
                            "error"
                        );

                    }

                }
            );


            /* ================================================
               EMAIL
            ================================================= */

            const email =
                document.getElementById(
                    "checkout-email"
                );


            const emailWrapper =
                email.closest(
                    ".checkout-field"
                );


            if (
                email.value.trim() &&
                !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
                    email.value.trim()
                )
            ) {

                emailWrapper.classList.add(
                    "error"
                );

                valid = false;

            }


            /* ================================================
               RUT
            ================================================= */

            const rut =
                document.getElementById(
                    "checkout-rut"
                );


            const rutWrapper =
                rut.closest(
                    ".checkout-field"
                );


            if (
                rut.value.trim() &&
                !validateRut(
                    rut.value
                )
            ) {

                rutWrapper.classList.add(
                    "error"
                );

                valid = false;

            }


            return valid;

        }

                    ).value,

                newsletter:

                shipping:

                payment:

            };


            localStorage.setItem(

                JSON.stringify(
                    data
                )
            );


            return data;

        }


        /* =====================================================
           INICIALIZAR
        ====================================================== */

        function initializeCheckout() {

            const payButton =
                document.getElementById(
                    "checkout-pay"
                );


            if (
                !payButton
            ) {

                return;

            }


            payButton.addEventListener(
                "click",
                function () {


                    /* =========================================
                       VALIDAR
                    ========================================== */

                    if (
                        !validateCheckout()
                    ) {

                        const firstError =
                            document.querySelector(
                                ".checkout-field.error input, .checkout-field.error select"
                            );


                        firstError?.focus();


                        return;

                    }


                    /* =========================================
                       GUARDAR DATOS
                    ========================================== */

                    const checkoutData =
                        saveCheckoutData();


                    console.log(
                        "SATORII · Checkout:",
                        checkoutData
                    );


                    /* =========================================
                       FLOW — PENDIENTE BACKEND
                    ========================================== */

                    alert(
                        "Checkout listo. El siguiente paso será conectar este botón con Flow mediante el backend de SATORII."
                    );

                }
            );


            /* ================================================
               RUT
            ================================================= */

            const rut =
                document.getElementById(
                    "checkout-rut"
                );


            rut?.addEventListener(
                "input",
                function () {

                    let value =
                        rut.value
                        .replace(
                            /[^0-9kK]/g,
                            ""
                        )
                        .toUpperCase();


                    if (
                        value.length > 1
                    ) {

                        const body =
                            value.slice(
                                0,
                                -1
                            );


                        const verifier =
                            value.slice(
                                -1
                            );


                        let formattedBody =
                            body;


                        if (
                            body.length > 3
                        ) {

                            formattedBody =
                                Number(
                                    body
                                )
                                .toLocaleString(
                                    "es-CL"
                                )
                                .replace(
                                    /,/g,
                                    "."
                                );

                        }


                        rut.value =
                            formattedBody +
                            "-" +
                            verifier;

                    }

                }
            );

        }
