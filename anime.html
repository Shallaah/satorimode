<!DOCTYPE html>
<html lang="es">

<head>

    <link
        rel="icon"
        type="image/png"
        href="img/logo.png"
    >

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="SATORII Anime — Poleras y prendas inspiradas en anime y manga."
    >

    <title>Anime | SATORII</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <style>

        /* =====================================================
           SATORII · ANIME
        ====================================================== */


        /* =====================================================
           ESTRUCTURA
        ====================================================== */

        .anime-page {

            width: min(
                var(--satori-content-width, 1800px),
                calc(
                    100% -
                    (
                        var(--satori-side-space, 30px) * 2
                    )
                )
            );

            margin-left: auto;
            margin-right: auto;

            box-sizing: border-box;

        }


        /* =====================================================
           INTRO
        ====================================================== */

        .anime-intro {

            padding-top: 110px;
            padding-bottom: 70px;

            text-align: center;

        }


        .anime-intro-label {

            margin-bottom: 16px;

            color:
                var(--red, #EF0930);

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 4px;

        }


        .anime-intro h1 {

            margin: 0;

            color: #111;

            font-size: clamp(
                48px,
                6vw,
                88px
            );

            line-height: .95;

            font-weight: 900;

            letter-spacing: -4px;

        }


        .anime-intro h1 span {

            color:
                var(--red, #EF0930);

        }


        .anime-intro p {

            max-width: 650px;

            margin: 25px auto 0;

            color: #666;

            font-size: 15px;

            line-height: 1.7;

        }


        /* =====================================================
           BARRA DE CATEGORÍA
        ====================================================== */

        .anime-category-bar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 45px;

            padding-bottom: 18px;

            border-bottom:
                1px solid #ddd;

        }


        .anime-category-title {

            margin: 0;

            color: #111;

            font-size: 14px;

            font-weight: 800;

            letter-spacing: 1px;

        }


        .anime-product-count {

            color: #777;

            font-size: 12px;

            white-space: nowrap;

        }


        /* =====================================================
           GRID
        ====================================================== */

        .anime-products-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    5,
                    minmax(0, 1fr)
                );

            column-gap: 22px;

            row-gap: 75px;

            width: 100%;

        }


        /* =====================================================
           PRODUCTO
        ====================================================== */

        .anime-product {

            display: block;

            min-width: 0;

            color: inherit;

            text-decoration: none;

            cursor: pointer;

        }


        /* =====================================================
           IMAGEN
        ====================================================== */

        .anime-product-image {

            position: relative;

            width: 100%;

            aspect-ratio: 1 / 1;

            overflow: hidden;

            background: #f7f7f7;

            border-radius: 8px;

        }


        .anime-product-image img {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            display: block;

            object-fit: cover;

            transition:
                opacity .35s ease,
                transform .45s ease;

        }


        /* =====================================================
           IMAGEN PRINCIPAL
        ====================================================== */

        .anime-product-image
        .image-primary {

            opacity: 1;

        }


        /* =====================================================
           IMAGEN SECUNDARIA
        ====================================================== */

        .anime-product-image
        .image-secondary {

            opacity: 0;

        }


        /* =====================================================
           HOVER
        ====================================================== */

        .anime-product:hover
        .anime-product-image
        .image-primary {

            opacity: 0;

        }


        .anime-product:hover
        .anime-product-image
        .image-secondary {

            opacity: 1;

        }


        .anime-product:hover
        .anime-product-image img {

            transform:
                scale(1.025);

        }


        /* =====================================================
           BADGES
        ====================================================== */

        .anime-product-badges {

            position: absolute;

            top: 10px;

            left: 10px;

            z-index: 5;

            display: flex;

            flex-wrap: wrap;

            gap: 5px;

        }


        .anime-product-badge {

            display: inline-flex;

            align-items: center;

            min-height: 24px;

            padding:
                5px 8px;

            box-sizing: border-box;

            background: #111;

            color: #fff;

            border-radius: 3px;

            font-size: 7px;

            font-weight: 900;

            letter-spacing: 1px;

            line-height: 1;

        }


        .anime-product-badge.new {

            background:
                var(--red, #EF0930);

        }


        .anime-product-badge.featured {

            background: #111;

        }


        /* =====================================================
           INFORMACIÓN
        ====================================================== */

        .anime-product-info {

            padding-top: 16px;

        }


        .anime-product-category {

            margin-bottom: 6px;

            color:
                var(--red, #EF0930);

            font-size: 9px;

            font-weight: 800;

            letter-spacing: 1.5px;

            text-transform: uppercase;

        }


        .anime-product-name {

            margin: 0;

            color: #111;

            font-size: 14px;

            line-height: 1.3;

            font-weight: 600;

        }


        .anime-product-price {

            margin-top: 7px;

            color: #111;

            font-size: 14px;

            font-weight: 700;

        }


        /* =====================================================
           SIN PRODUCTOS
        ====================================================== */

        .anime-empty {

            grid-column:
                1 / -1;

            padding:
                100px 20px;

            color: #777;

            text-align: center;

        }


        .anime-empty strong {

            display: block;

            margin-bottom: 10px;

            color: #111;

            font-size: 20px;

        }


        /* =====================================================
           PACK FINAL
        ====================================================== */

        .anime-pack {

            position: relative;

            margin-top: 120px;

            margin-bottom: 100px;

            min-height: 230px;

            padding: 50px;

            display: flex;

            align-items: center;

            box-sizing: border-box;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #111827 0%,
                    #090d15 100%
                );

            color: #fff;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .18
                );

            border-radius: 10px;

        }


        .anime-pack::before {

            content: "";

            position: absolute;

            top: 0;

            left: 0;

            width: 150px;

            height: 2px;

            background:
                var(--red, #EF0930);

        }


        .anime-pack::after {

            content: "";

            position: absolute;

            right: 0;

            bottom: 0;

            width: 150px;

            height: 2px;

            background:
                var(--red, #EF0930);

        }


        .anime-pack-content {

            position: relative;

            z-index: 2;

            max-width: 650px;

        }


        .anime-pack-label {

            margin-bottom: 8px;

            color:
                var(--red, #EF0930);

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 4px;

        }


        .anime-pack h2 {

            margin:
                0 0 12px;

            font-size:
                clamp(
                    30px,
                    4vw,
                    52px
                );

            line-height: 1;

            font-weight: 900;

        }


        .anime-pack h2 span {

            color:
                var(--red, #EF0930);

        }


        .anime-pack p {

            margin: 0;

            color: #ccc;

            font-size: 14px;

            line-height: 1.6;

        }


        /* =====================================================
           TABLET
        ====================================================== */

        @media (max-width: 1400px) {

            .anime-products-grid {

                grid-template-columns:
                    repeat(
                        4,
                        minmax(0, 1fr)
                    );

            }

        }


        @media (max-width: 1050px) {

            .anime-products-grid {

                grid-template-columns:
                    repeat(
                        3,
                        minmax(0, 1fr)
                    );

                column-gap: 18px;

                row-gap: 55px;

            }


            .anime-intro {

                padding-top: 90px;

            }

        }


        /* =====================================================
           MÓVIL
        ====================================================== */

        @media (max-width: 700px) {

            .anime-page {

                width:
                    calc(
                        100% - 30px
                    );

            }


            .anime-intro {

                padding-top: 95px;

                padding-bottom: 50px;

            }


            .anime-intro h1 {

                font-size: 48px;

                letter-spacing: -2px;

            }


            .anime-intro p {

                font-size: 13px;

            }


            .anime-category-bar {

                margin-bottom: 30px;

            }


            .anime-products-grid {

                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );

                column-gap: 14px;

                row-gap: 45px;

            }


            .anime-product-info {

                padding-top: 11px;

            }


            .anime-product-category {

                font-size: 8px;

            }


            .anime-product-name {

                font-size: 12px;

            }


            .anime-product-price {

                margin-top: 5px;

                font-size: 12px;

            }


            .anime-product-badges {

                top: 7px;

                left: 7px;

                gap: 4px;

            }


            .anime-product-badge {

                min-height: 21px;

                padding:
                    4px 6px;

                font-size: 6px;

            }


            .anime-pack {

                margin-top: 80px;

                margin-bottom: 60px;

                min-height: 220px;

                padding:
                    30px 25px;

                border-radius: 8px;

            }


            .anime-pack::before {

                width: 90px;

            }


            .anime-pack::after {

                width: 90px;

            }


            .anime-pack h2 {

                font-size: 32px;

            }

        }


        @media (max-width: 420px) {

            .anime-category-bar {

                align-items:
                    flex-start;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div id="satori-header"></div>


    <main>


        <div class="anime-page">


            <!-- =================================================
                 INTRO
            ================================================== -->

            <section class="anime-intro">

                <div class="anime-intro-label">
                    SATORII · ANIME
                </div>


                <h1>
                    ANIME
                    <span>
                        MODE.
                    </span>
                </h1>


                <p>
                    Prendas inspiradas en anime y manga,
                    llevadas a un estilo urbano.
                </p>

            </section>


            <!-- =================================================
                 CATEGORÍA
            ================================================== -->

            <div class="anime-category-bar">

                <h2 class="anime-category-title">
                    COLECCIÓN ANIME
                </h2>


                <span
                    class="anime-product-count"
                    id="anime-product-count"
                >
                    0 productos
                </span>

            </div>


            <!-- =================================================
                 PRODUCTOS
            ================================================== -->

            <section
                class="anime-products-grid"
                id="anime-products-grid"
            >
            </section>


            <!-- =================================================
                 PACK FINAL
            ================================================== -->

            <section class="anime-pack">

                <div class="anime-pack-content">

                    <div class="anime-pack-label">
                        SATORII
                    </div>


                    <h2>
                        LLEVA TU
                        <span>
                            ANIME.
                        </span>
                    </h2>


                    <p>
                        Descubre nuestras prendas
                        inspiradas en anime y manga.
                    </p>

                </div>

            </section>


        </div>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div id="satori-footer"></div>


    <!-- =====================================================
         SCRIPTS
    ====================================================== -->

    <script src="js/products.js"></script>

    <script src="js/header.js"></script>

    <script src="js/footer.js"></script>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                "use strict";


                /* =================================================
                   ELEMENTOS
                ================================================= */

                const grid =
                    document.getElementById(
                        "anime-products-grid"
                    );


                const count =
                    document.getElementById(
                        "anime-product-count"
                    );


                if (!grid) {

                    return;

                }


                /* =================================================
                   COMPROBAR PRODUCTS.JS
                ================================================= */

                if (
                    typeof PRODUCTS === "undefined" ||
                    !Array.isArray(PRODUCTS)
                ) {

                    grid.innerHTML = `

                        <div class="anime-empty">

                            <strong>
                                No se pudo cargar el catálogo.
                            </strong>

                            Revisa que
                            js/products.js
                            esté disponible.

                        </div>

                    `;

                    return;

                }


                /* =================================================
                   FILTRAR PRODUCTOS ANIME
                ================================================= */

                const animeProducts =
                    PRODUCTS.filter(
                        function (product) {

                            return (
                                product.available === true &&
                                String(
                                    product.category || ""
                                )
                                .toLowerCase()
                                .trim() ===
                                "anime"
                            );

                        }
                    );


                /* =================================================
                   CONTADOR
                ================================================= */

                count.textContent =
                    `${animeProducts.length} ${
                        animeProducts.length === 1
                            ? "producto"
                            : "productos"
                    }`;


                /* =================================================
                   ESCAPE HTML
                ================================================= */

                function escapeHTML(
                    value
                ) {

                    return String(
                        value ?? ""
                    )
                    .replace(
                        /&/g,
                        "&amp;"
                    )
                    .replace(
                        /</g,
                        "&lt;"
                    )
                    .replace(
                        />/g,
                        "&gt;"
                    )
                    .replace(
                        /"/g,
                        "&quot;"
                    )
                    .replace(
                        /'/g,
                        "&#039;"
                    );

                }


                /* =================================================
                   CREAR SLUG
                ================================================= */

                function createProductSlug(
                    product
                ) {

                    return String(
                        product.id ||
                        product.name ||
                        ""
                    )
                    .normalize("NFD")
                    .replace(
                        /[\u0300-\u036f]/g,
                        ""
                    )
                    .toLowerCase()
                    .trim()
                    .replace(
                        /[^a-z0-9]+/g,
                        "-"
                    )
                    .replace(
                        /^-+|-+$/g,
                        "");

                }


                /* =================================================
                   OBTENER URL DEL PRODUCTO
                ================================================= */

                function getProductUrl(
                    product
                ) {

                    if (
                        !product
                    ) {

                        return "#";

                    }


                    /*
                     * =================================================
                     * URL DEFINIDA EN PRODUCTS.JS
                     * =================================================
                     */

                    if (
                        product.url
                    ) {

                        let url =
                            String(
                                product.url
                            )
                            .trim();


                        /*
                         * Eliminar barras iniciales.
                         */

                        url =
                            url.replace(
                                /^\/+/,
                                ""
                            );


                        /*
                         * Si ya viene con
                         * satorimode/, no lo duplicamos.
                         */

                        if (
                            url.startsWith(
                                "satorimode/"
                            )
                        ) {

                            return "/" + url;

                        }


                        /*
                         * Ruta normal del proyecto.
                         */

                        return (
                            "/satorimode/" +
                            url
                        );

                    }


                    /*
                     * =================================================
                     * RESPALDO
                     * =================================================
                     */

                    const productId =
                        createProductSlug(
                            product
                        );


                    return (
                        "/satorimode/" +
                        "productos/" +
                        "anime/" +
                        productId +
                        ".html"
                    );

                }


                /* =================================================
                   FORMATO PRECIO
                ================================================= */

                function formatPrice(
                    value
                ) {

                    return new Intl.NumberFormat(
                        "es-CL",
                        {
                            style:
                                "currency",

                            currency:
                                "CLP",

                            maximumFractionDigits:
                                0
                        }
                    )
                    .format(
                        Number(
                            value
                        ) || 0
                    );

                }


                /* =================================================
                   SIN PRODUCTOS
                ================================================= */

                if (
                    animeProducts.length === 0
                ) {

                    grid.innerHTML = `

                        <div class="anime-empty">

                            <strong>
                                Próximamente
                            </strong>

                            Estamos preparando
                            nuevos diseños de anime.

                        </div>

                    `;

                    return;

                }


                /* =================================================
                   CREAR TARJETAS
                ================================================= */

                animeProducts.forEach(
                    function (product) {

                        /* =========================================
                           IMÁGENES
                        ========================================== */

                        const primaryImage =
                            product.images?.[0] ||
                            product.image ||
                            "";


                        const secondaryImage =
                            product.images?.[1] ||
                            primaryImage;


                        /* =========================================
                           URL
                        ========================================== */

                        const productUrl =
                            getProductUrl(
                                product
                            );


                        /* =========================================
                           PRECIO
                        ========================================== */

                        const price =
                            formatPrice(
                                product.price
                            );


                        /* =========================================
                           BADGES
                        ========================================== */

                        const badges = [];


                        /*
                         * NUEVO
                         */

                        if (
                            typeof isProductNew ===
                            "function" &&
                            isProductNew(
                                product
                            )
                        ) {

                            badges.push(`

                                <span
                                    class="
                                        anime-product-badge
                                        new
                                    "
                                >
                                    NUEVO
                                </span>

                            `);

                        }


                        /*
                         * DESTACADO
                         */

                        if (
                            product.featured ===
                            true
                        ) {

                            badges.push(`

                                <span
                                    class="
                                        anime-product-badge
                                        featured
                                    "
                                >
                                    DESTACADO
                                </span>

                            `);

                        }


                        /* =========================================
                           TARJETA
                        ========================================== */

                        const card =
                            document.createElement(
                                "a"
                            );


                        card.className =
                            "anime-product";


                        /*
                         * IMPORTANTE:
                         *
                         * La tarjeta completa es el enlace.
                         */

                        card.href =
                            productUrl;


                        card.setAttribute(
                            "aria-label",
                            `Ver ${
                                product.name ||
                                "producto"
                            }`
                        );


                        /* =========================================
                           HTML
                        ========================================== */

                        card.innerHTML = `

                            <div
                                class="
                                    anime-product-image
                                "
                            >

                                ${
                                    badges.length
                                        ? `

                                            <div
                                                class="
                                                    anime-product-badges
                                                "
                                            >

                                                ${badges.join("")}

                                            </div>

                                        `
                                        : ""
                                }


                                ${
                                    primaryImage
                                        ? `

                                            <img
                                                class="
                                                    image-primary
                                                "
                                                src="${escapeHTML(
                                                    primaryImage
                                                )}"
                                                alt="${escapeHTML(
                                                    product.name ||
                                                    "Producto SATORII"
                                                )}"
                                                loading="lazy"
                                            >

                                        `
                                        : ""
                                }


                                ${
                                    secondaryImage
                                        ? `

                                            <img
                                                class="
                                                    image-secondary
                                                "
                                                src="${escapeHTML(
                                                    secondaryImage
                                                )}"
                                                alt="${escapeHTML(
                                                    product.name ||
                                                    "Producto SATORII"
                                                )}"
                                                loading="lazy"
                                            >

                                        `
                                        : ""
                                }

                            </div>


                            <div
                                class="
                                    anime-product-info
                                "
                            >

                                <div
                                    class="
                                        anime-product-category
                                    "
                                >
                                    ANIME
                                </div>


                                <h3
                                    class="
                                        anime-product-name
                                    "
                                >

                                    ${escapeHTML(
                                        product.name ||
                                        "Producto"
                                    )}

                                </h3>


                                <div
                                    class="
                                        anime-product-price
                                    "
                                >

                                    ${price}

                                </div>

                            </div>

                        `;


                        grid.appendChild(
                            card
                        );

                    }
                );

            }
        );

    </script>


</body>

</html>
